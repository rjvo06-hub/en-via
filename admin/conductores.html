<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Gestión de Conductores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librería jsQR para leer imágenes de códigos QR en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="../js/supabaseClient.js"></script>
    <style>
        input, select, textarea { font-size: 16px !important; }
        @media (min-width: 640px) { input, select, textarea { font-size: 0.85rem !important; } }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased p-3 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-[#222222] pb-4">
            <div>
                <h1 class="text-xl font-extrabold text-emerald-500 tracking-tight">EN-VIA - Conductores</h1>
                <p class="text-slate-400 text-xs">Administración de choferes, flota y datos bancarios</p>
            </div>
            <a href="../index.html" class="px-3 py-1.5 bg-[#161616] hover:bg-[#222222] border border-[#2e2e2e] text-xs font-medium rounded-xl transition">
                ← Volver al Inicio
            </a>
        </header>

        <!-- Formulario de Registro / Modificación -->
        <div class="bg-[#111111] border border-[#222222] p-4 rounded-2xl shadow-xl space-y-4">
            <h2 id="form-title" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Registrar Nuevo Conductor</h2>
            <input type="hidden" id="conductor-id">
            
            <!-- Datos Personales -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Teléfono Personal</label>
                    <input type="text" id="telefono" placeholder="Ej. 0414-1234567" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Estado</label>
                    <select id="activo" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
            </div>

            <!-- Datos Bancarios y Lector de Imagen QR -->
            <div class="space-y-3 pt-3 border-t border-[#222222]">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">Datos Bancarios y Lector de QR</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Banco</label>
                        <input type="text" id="banco" placeholder="Ej. Banesco" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Teléfono (Pago Móvil)</label>
                        <input type="text" id="banco-telefono" placeholder="Ej. 04121234567" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Cédula / RIF</label>
                        <input type="text" id="banco-cedula" placeholder="Ej. V12345678" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400">Adjuntar Imagen QR del Banco</label>
                    <input type="file" id="qr-file-input" accept="image/*" onchange="leerImagenQR(event)" class="w-full bg-[#161616] border border-[#2e2e2e] rounded-xl p-2 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Código Extraído del QR (Se guarda como texto)</label>
                        <textarea id="qr_codigo" rows="2" placeholder="Selecciona una imagen de QR arriba para extraer su código automáticamente..." class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl p-2.5 text-white outline-none text-[11px] font-mono"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="guardarConductor()" id="btn-guardar" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow-lg cursor-pointer">
                    Guardar Conductor
                </button>
                <button onclick="limpiarFormulario()" id="btn-cancelar" class="hidden px-4 py-2.5 bg-[#1a1a1a] hover:bg-[#262626] border border-[#2e2e2e] text-slate-300 font-bold text-xs rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
            </div>
        </div>

        <!-- Lista de Conductores Registrados -->
        <div class="bg-[#111111] border border-[#222222] p-4 rounded-2xl shadow-xl space-y-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Lista de Conductores Registrados</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-[#222222] text-slate-400">
                            <th class="p-2.5">Nombre</th>
                            <th class="p-2.5">Teléfono</th>
                            <th class="p-2.5">Banco / Datos Pago</th>
                            <th class="p-2.5">Estado</th>
                            <th class="p-2.5 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-conductores" class="divide-y divide-[#1a1a1a]"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', cargarConductores);

        // Función para leer la imagen del QR adjuntada y extraer su texto con jsQR
        function leerImagenQR(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        document.getElementById('qr_codigo').value = code.data;
                        alert('¡Código QR leído y extraído con éxito!');
                    } else {
                        alert('No se pudo detectar un código QR válido en la imagen. Intenta con otra imagen más clara.');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function cargarConductores() {
            const { data, error } = await supabaseClient.from('conductores').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tabla-conductores');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">No hay conductores registrados.</td></tr>`;
                return;
            }

            data.forEach(c => {
                const bancarios = c.datos_bancarios || {};
                const infoBanco = bancarios.banco ? `${bancarios.banco} (${bancarios.telefono || 'Sin tlf'})` : 'No configurado';

                tbody.innerHTML += `
                    <tr class="hover:bg-[#161616] transition">
                        <td class="p-2.5 font-medium text-slate-200">${c.nombre}</td>
                        <td class="p-2.5 text-slate-400">${c.telefono || 'N/A'}</td>
                        <td class="p-2.5 text-amber-400/90">${infoBanco}</td>
                        <td class="p-2.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${c.activo ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
                                ${c.activo ? 'Activo' : 'Inactivo'}
                            </span>
                        </td>
                        <td class="p-2.5 text-right space-x-2">
                            <button onclick='editarConductor("${c.id}", ${JSON.stringify(c.nombre)}, ${JSON.stringify(c.telefono || '')}, ${c.activo}, ${JSON.stringify(bancarios)})' class="text-emerald-400 hover:text-emerald-300 font-semibold cursor-pointer">Editar</button>
                            <button onclick="eliminarConductor('${c.id}')" class="text-red-400 hover:text-red-300 font-semibold cursor-pointer">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarConductor() {
            const id = document.getElementById('conductor-id').value;
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const activo = document.getElementById('activo').value === 'true';

            const banco = document.getElementById('banco').value.trim();
            const bancoTelefono = document.getElementById('banco-telefono').value.trim();
            const bancoCedula = document.getElementById('banco-cedula').value.trim();
            const qrCodigo = document.getElementById('qr_codigo').value.trim();

            if (!nombre) { alert('El nombre es obligatorio.'); return; }

            const datos_bancarios = {
                banco: banco,
                telefono: bancoTelefono,
                cedula_rif: bancoCedula,
                qr_codigo: qrCodigo
            };

            if (id) {
                const { error } = await supabaseClient.from('conductores').update({ nombre, telefono, activo, datos_bancarios }).eq('id', id);
                if (error) alert('Error al actualizar: ' + error.message);
            } else {
                const { error } = await supabaseClient.from('conductores').insert([{ nombre, telefono, activo, datos_bancarios }]);
                if (error) alert('Error al crear: ' + error.message);
            }

            limpiarFormulario();
            cargarConductores();
        }

        function editarConductor(id, nombre, telefono, activo, bancarios) {
            document.getElementById('conductor-id').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('telefono').value = telefono;
            document.getElementById('activo').value = activo.toString();

            document.getElementById('banco').value = bancarios.banco || '';
            document.getElementById('banco-telefono').value = bancarios.telefono || '';
            document.getElementById('banco-cedula').value = bancarios.cedula_rif || '';
            document.getElementById('qr_codigo').value = bancarios.qr_codigo || '';

            document.getElementById('form-title').textContent = "Modificar Conductor";
            document.getElementById('btn-guardar').textContent = "Actualizar Conductor";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function eliminarConductor(id) {
            if (confirm('¿Estás seguro de eliminar este conductor?')) {
                const { error } = await supabaseClient.from('conductores').delete().eq('id', id);
                if (error) alert('Error al eliminar: ' + error.message);
                cargarConductores();
            }
        }

        function limpiarFormulario() {
            document.getElementById('conductor-id').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('activo').value = 'true';
            document.getElementById('banco').value = '';
            document.getElementById('banco-telefono').value = '';
            document.getElementById('banco-cedula').value = '';
            document.getElementById('qr_codigo').value = '';
            document.getElementById('qr-file-input').value = '';
            
            document.getElementById('form-title').textContent = "Registrar Nuevo Conductor";
            document.getElementById('btn-guardar').textContent = "Guardar Conductor";
            document.getElementById('btn-cancelar').classList.add('hidden');
        }
    </script>
</body>
</html>
