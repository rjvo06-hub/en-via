<body>
    <audio id="alarma-audio" preload="auto" playsinline>
        <source src="https://en-via.azubiform.de/alerta_envia_1.wav" type="audio/wav">
        <source src="./alerta_envia_1.wav" type="audio/wav">
    </audio>

    <div id="portal-container" class="max-w-3xl">
        <header>
            <h1>EN-VIA - Panel de Chofer</h1>
            <p>Conectado como: <strong id="driver-name-display" style="color:#ffffff;"></strong></p>
            <div class="acciones-header-chofer">
                <button type="button" id="btn-ver-historial" class="btn-historial-header" onclick="alternarHistorialCarreras()">📋 Historial de Carreras</button>

        <div id="panel-historial" class="panel-historial-carreras hidden">

                <h2 style="color:#38bdf8; margin:0; font-size:15px;">Historial de Carreras (<span id="contador-historial">0</span>)</h2>

                <button type="button" class="btn-restaurar-mini" onclick="seleccionarHoyHistorial()">Hoy</button>

        <div id="seccion-asignada" class="hidden">
            <h2 style="color:#34d399; margin-bottom:8px;">Tu Carrera en Curso</h2>
            <div id="carrera-asignada-container"></div>
        </div>

        <div style="margin-top:16px;">
            <h2 style="color:#94a3b8; margin-bottom:8px;">Carreras Pendientes para Tomar</h2>

        <div id="seccion-descartadas-activas">
            <button type="button" id="btn-toggle-descartadas" class="seccion-descartadas-toggle" onclick="alternarDescartadasActivas()">
                <span>Carreras Descartadas Activas (<span id="contador-descartadas-activas">0</span>)</span>
                <span id="icono-toggle-descartadas">▼</span>

                <div style="margin-top:8px; color:#94a3b8; font-size:13px;">No hay carreras descartadas activas.</div>

    <script>
        var conductorActual = "";
        var conductorIdActual = null;
        var timerInterval = null;
        var pollingInterval = null;
        var primeraCargaRealizada = false;
        var idsPendientesConocidos = {};
        var carrerasDescartadasIds = [];
        var descartadasExpandida = false;
        var historialVisible = false;
        var mostrarTodoHistorial = false;
        var audioCtx = null;
        var audioDesbloqueado = false;
        var canalAlertaConductorId = "envia_alerta_1_v1";
        var sonidoAlertaNativo = "alerta_envia_1";
        var canalAlertaCreado = false;
        var intervaloSondeoMs = 1200;

        var alarmaInterval = null;
        var alarmaActiva = false;
        var hayCarreraNuevaSinVer = false;
        var ultimaActivacionAlarmaMs = 0;

        var baseLat = "10.670389";
        var baseLng = "-71.658972";

        function getDb() {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                window.supabaseClient = supabaseClient;
                return supabaseClient;
            }
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                window.supabaseClient = window.supabase.createClient(DIRECT_SUPABASE_URL, DIRECT_SUPABASE_KEY);
                window.supabaseIsRealtime = true;
                return window.supabaseClient;
            }
            return null;
        }

        function desbloquearMotorAudio() {
            try {
                if (!audioCtx) {
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended' && typeof audioCtx.resume === 'function') {
                    audioCtx.resume().catch(function () {});
                }
                if (audioCtx && !audioDesbloqueado) {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.02);
                    audioDesbloqueado = true;
                }
            } catch (e) {}
        }

        async function asegurarCanalSonidoConductor() {
            if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.LocalNotifications) return;
            var LocalNotifications = window.Capacitor.Plugins.LocalNotifications;
            try {
                if (typeof LocalNotifications.requestPermissions === 'function') {
                    await LocalNotifications.requestPermissions();
                }
                if (!canalAlertaCreado && typeof LocalNotifications.createChannel === 'function') {
                    await LocalNotifications.createChannel({
                        id: canalAlertaConductorId,
                        name: 'Alerta EN-VIA 1',
                        description: 'Sonido de alerta de alta prioridad para conductores',
                        importance: 5,
                        visibility: 1,
                        sound: sonidoAlertaNativo,
                        vibration: false
                    });
                    canalAlertaCreado = true;
                }
            } catch (e) {}
        }

        function notificarNativoNuevaCarrera(cantidadPendientes, carreraInfo) {
            var titulo = "EN-VIA: Nueva carrera disponible";
            var detalle = carreraInfo && carreraInfo.origen
                ? (carreraInfo.origen + " → " + (carreraInfo.destino || "Destino") + (carreraInfo.precio ? " (" + carreraInfo.precio + ")" : ""))
                : ("Hay " + cantidadPendientes + " carrera(s) pendiente(s) por tomar.");
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
                    asegurarCanalSonidoConductor().then(function () {
                        window.Capacitor.Plugins.LocalNotifications.schedule({
                            notifications: [{
                                id: Math.floor(Date.now() % 2147483647),
                                title: titulo,
                                body: detalle,
                                channelId: canalAlertaConductorId,
                                sound: sonidoAlertaNativo,
                                schedule: { at: new Date(Date.now() + 10) }
                            }]
                        }).catch(function () {});
                    });
                }
            } catch (e) {}

            try {
                if (window.AndroidAlarma && typeof window.AndroidAlarma.dispararAlerta === 'function') {
                    window.AndroidAlarma.dispararAlerta(titulo, detalle);
                }
            } catch (e) {}
        }

        function reproducirAlerta1Web() {
            if (!audioCtx) return;
            var notas = [
                [1850, 0.14], [0, 0.07], [2200, 0.18], [0, 0.18],
                [1850, 0.14], [0, 0.07], [2200, 0.22]
            ];
            var cursor = audioCtx.currentTime;

            for (var i = 0; i < notas.length; i++) {
                var freq = notas[i][0];
                var dur = notas[i][1];
                if (freq > 0) {
                    var osc1 = audioCtx.createOscillator();
                    var osc2 = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(freq, cursor);
                    osc2.frequency.setValueAtTime(freq * 2, cursor);

                    gain.gain.setValueAtTime(0.01, cursor);
                    gain.gain.linearRampToValueAtTime(0.78, cursor + 0.005);
                    gain.gain.setValueAtTime(0.78, cursor + Math.max(0.01, dur - 0.005));
                    gain.gain.linearRampToValueAtTime(0.001, cursor + dur);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc1.start(cursor);
                    osc2.start(cursor);
                    osc1.stop(cursor + dur + 0.01);
                    osc2.stop(cursor + dur + 0.01);
                }
                cursor += dur;
            }
        }

        function reproducirTimbreRapido() {
            try {
                desbloquearMotorAudio();
                var audioElement = document.getElementById('alarma-audio');
                if (audioElement) {
                    audioElement.muted = false;
                    audioElement.volume = 1.0;
                    if (audioElement.readyState >= 2 && !audioElement.error) {
                        audioElement.currentTime = 0;
                        var playPromise = audioElement.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(function () {
                                reproducirAlerta1Web();
                            });
                        }
                        return;
                    }
                }
                reproducirAlerta1Web();
            } catch (e) {}
        }

        function dispararPulsoTimbre() {
            try {
                reproducirTimbreRapido();
            } catch (e) {
                console.log("Error en timbre:", e);
            }
        }

        function iniciarAlarmaPersistente(cantidadPendientes, carreraNueva) {
            hayCarreraNuevaSinVer = true;
            notificarNativoNuevaCarrera(cantidadPendientes || 1, carreraNueva || null);
            ultimaActivacionAlarmaMs = Date.now();

            dispararPulsoTimbre();

            if (alarmaActiva) return;
            alarmaActiva = true;

            alarmaInterval = setInterval(function () {
                if (!alarmaActiva || !hayCarreraNuevaSinVer) {
                    detenerAlarmaPersistente();
                    return;
                }
                dispararPulsoTimbre();
            }, 2000);
        }

        function detenerAlarmaPersistente() {
            alarmaActiva = false;
            hayCarreraNuevaSinVer = false;
            if (alarmaInterval) {
                clearInterval(alarmaInterval);
                alarmaInterval = null;
            }
            var audioElement = document.getElementById('alarma-audio');
            if (audioElement) {
                try {
                    audioElement.pause();
                    audioElement.currentTime = 0;
                } catch (e) {}
            }
            try {
                if (window.AndroidAlarma && typeof window.AndroidAlarma.detenerAlerta === 'function') {
                    window.AndroidAlarma.detenerAlerta();
                }
            } catch (e) {}
        }

        function manejarToqueEnPantalla() {
            desbloquearMotorAudio();
            if (!alarmaActiva) return;
            if ((Date.now() - ultimaActivacionAlarmaMs) < 200) return;
            detenerAlarmaPersistente();
        }

        document.addEventListener('touchstart', manejarToqueEnPantalla, { passive: true });
        document.addEventListener('pointerdown', manejarToqueEnPantalla, { passive: true });

        function desconectarTemporizadoresYAlertas() {
            detenerAlarmaPersistente();
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        function reanudarCicloConductor() {
            if (!conductorActual) return;
            asegurarCanalSonidoConductor();
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(function () {
                cargarDatosConductor();
            }, intervaloSondeoMs);
            suscripcionRealtime();
            cargarDatosConductor();
        }

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden && conductorActual) {
                reanudarCicloConductor();
            }
        });

        window.addEventListener('focus', function () {
            if (conductorActual) {
                reanudarCicloConductor();
            }
        });

        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
            window.Capacitor.Plugins.App.addListener('appStateChange', function (state) {
                if (state && state.isActive && conductorActual) {
                    reanudarCicloConductor();
                }
            });
        }

        window.addEventListener('load', function () {
            asegurarCanalSonidoConductor();
            var sesionGuardada = sessionStorage.getItem('conductor_en_via');
            var sesionIdGuardada = sessionStorage.getItem('conductor_id_en_via');

            if (!sesionGuardada) {
                window.location.replace('./index.html');
                return;
            }

            conductorActual = sesionGuardada;
            conductorIdActual = sesionIdGuardada || null;
            mostrarPortal();
        });

        function mostrarPortal() {
            document.getElementById('driver-name-display').textContent = conductorActual;

            cargarDatosConductor();
            suscripcionRealtime();

            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(function () {
                cargarDatosConductor();
            }, intervaloSondeoMs);
        }

        function cerrarSesion() {
            desconectarTemporizadoresYAlertas();
            conductorActual = "";
            conductorIdActual = null;
            primeraCargaRealizada = false;
            idsPendientesConocidos = {};
            carrerasDescartadasIds = [];
            descartadasExpandida = false;
            historialVisible = false;
            mostrarTodoHistorial = false;

            sessionStorage.removeItem('conductor_en_via');
            sessionStorage.removeItem('conductor_id_en_via');
            if (window.EnviaAuth && typeof window.EnviaAuth.limpiarEstadoLocal === 'function') {
                window.EnviaAuth.limpiarEstadoLocal();
            }

            window.location.replace('./index.html');
        }

        function obtenerFechaLocalInput() {
            var d = new Date();
            var anio = d.getFullYear();
            var mes = String(d.getMonth() + 1).padStart(2, '0');
            var dia = String(d.getDate()).padStart(2, '0');
            return anio + '-' + mes + '-' + dia;
        }

        function alternarHistorialCarreras() {
            historialVisible = !historialVisible;
            var panelEl = document.getElementById('panel-historial');
            var fechaInput = document.getElementById('fecha-historial');
            if (panelEl) {
                if (historialVisible) {
                    if (fechaInput && !fechaInput.value && !mostrarTodoHistorial) {
                        fechaInput.value = obtenerFechaLocalInput();
                    }
                    panelEl.classList.remove('hidden');
                    cargarHistorialConductor();
                } else {
                    panelEl.classList.add('hidden');
                }
            }
        }

        function alCambiarFechaHistorial() {
            mostrarTodoHistorial = false;
            cargarHistorialConductor();
        }

        function seleccionarHoyHistorial() {
            mostrarTodoHistorial = false;
            var fechaInput = document.getElementById('fecha-historial');
            if (fechaInput) {
                fechaInput.value = obtenerFechaLocalInput();
            }
            cargarHistorialConductor();
        }

        function verTodoHistorial() {
            mostrarTodoHistorial = true;
            cargarHistorialConductor();
        }

        function obtenerClaveFechaLocal(isoStr) {
            if (!isoStr) return '';
            var d = new Date(isoStr);
            if (isNaN(d.getTime())) return '';
            var anio = d.getFullYear();
            var mes = String(d.getMonth() + 1).padStart(2, '0');
            var dia = String(d.getDate()).padStart(2, '0');
            return anio + '-' + mes + '-' + dia;
        }

        function formatearDuracionCarrera(tiempos, createdAt) {
            var t = (typeof tiempos === 'object' && tiempos !== null) ? tiempos : {};
            var inicioIso = t.inicio_carrera_at || t.llegada_conductor_at || createdAt || null;
            var finIso = t.fin_recorrido_at || t.fin_carrera_at || null;

            if (!inicioIso || !finIso) {
                return 'N/D';
            }

            var msInicio = new Date(inicioIso).getTime();
            var msFin = new Date(finIso).getTime();
            if (isNaN(msInicio) || isNaN(msFin) || msFin < msInicio) {
                return 'N/D';
            }

            var totalSegs = Math.floor((msFin - msInicio) / 1000);
            var horas = Math.floor(totalSegs / 3600);
            var mins = Math.floor((totalSegs % 3600) / 60);
            var segs = totalSegs % 60;

            if (horas > 0) {
                return horas + 'h ' + String(mins).padStart(2, '0') + 'm';
            }
            if (mins > 0) {
                return mins + ' min ' + String(segs).padStart(2, '0') + ' s';
            }
            return segs + ' seg';
        }

        function formatearFechaCorta(isoStr) {
            if (!isoStr) return 'Sin fecha';
            var d = new Date(isoStr);
            if (isNaN(d.getTime())) return 'Sin fecha';
            var dia = String(d.getDate()).padStart(2, '0');
            var mes = String(d.getMonth() + 1).padStart(2, '0');
            var anio = d.getFullYear();
            var hora = String(d.getHours()).padStart(2, '0');
            var min = String(d.getMinutes()).padStart(2, '0');
            return dia + '/' + mes + '/' + anio + ' ' + hora + ':' + min;
        }

        function cargarHistorialConductor() {
            var db = getDb();
            var contenedor = document.getElementById('lista-historial-carreras');
            var contadorEl = document.getElementById('contador-historial');
            var fechaInput = document.getElementById('fecha-historial');
            if (!db || !conductorActual || !contenedor) return;

            var fechaSeleccionada = (!mostrarTodoHistorial && fechaInput) ? (fechaInput.value || '') : '';
            var limiteConsulta = mostrarTodoHistorial ? 30 : 50;

            db.from('carreras')
                .select('*')
                .eq('estado', 'completada')
                .eq('conductor_asignado', conductorActual)
                .order('created_at', { ascending: false })
                .limit(limiteConsulta)
                .then(function (res) {
                    if (res.error) {
                        contenedor.innerHTML = '<div style="color:#f87171; font-size:13px;">No se pudo cargar el historial: ' + res.error.message + '</div>';
                        return;
                    }
                    var lista = res.data || [];
                    if (fechaSeleccionada) {
                        lista = lista.filter(function (c) {
                            var tiempos = c.tiempos || {};
                            var refIso = tiempos.fin_carrera_at || tiempos.fin_recorrido_at || c.created_at;
                            return obtenerClaveFechaLocal(refIso) === fechaSeleccionada;
                        });
                    }
                    if (contadorEl) {
                        contadorEl.textContent = String(lista.length);
                    }
                    renderizarHistorialCarreras(lista, fechaSeleccionada);
                })
                .catch(function () {
                    contenedor.innerHTML = '<div style="color:#f87171; font-size:13px;">Error al consultar el historial.</div>';
                });
        }

        function renderizarHistorialCarreras(carreras, fechaSeleccionada) {
            var contenedor = document.getElementById('lista-historial-carreras');
            if (!contenedor) return;

            if (!carreras || carreras.length === 0) {
                var msgVacio = fechaSeleccionada
                    ? 'No hay carreras completadas para la fecha ' + fechaSeleccionada + '.'
                    : 'Aún no tienes carreras completadas registradas.';
                contenedor.innerHTML = '<div style="color:#94a3b8; font-size:13px;">' + msgVacio + '</div>';
                return;
            }

            var html = '';
            carreras.forEach(function (c) {
                var tiempos = c.tiempos || {};
                var duracion = formatearDuracionCarrera(tiempos, c.created_at);
                var fechaRef = formatearFechaCorta(tiempos.fin_carrera_at || tiempos.fin_recorrido_at || c.created_at);
                var costo = c.precio || '$0.00';

                html +=
                    '<div class="tarjeta-carrera-historial">' +
                        '<div class="cabecera-pendiente">' +
                            '<strong style="color:#34d399;">💰 ' + costo + '</strong>' +
                            '<span style="font-size:11px; color:#94a3b8;">' + fechaRef + '</span>' +
                        '</div>' +
                        '<p style="margin:3px 0;">📍 <strong>De:</strong> ' + (c.origen || 'N/A') + '</p>' +
                        '<p style="margin:3px 0;">🏁 <strong>A:</strong> ' + (c.destino || 'N/A') + '</p>' +
                        '<p style="margin:3px 0;">⏱️ <strong>Tiempo:</strong> ' + duracion + ' &nbsp;|&nbsp; 📏 <strong>Dist.:</strong> ' + (c.distancia || 'N/A') + '</p>' +
                        '<p style="margin:3px 0; font-size:12px; color:#94a3b8;">👤 Cliente: ' + (c.cliente_nombre || 'N/A') + '</p>' +
                    '</div>';
            });
            contenedor.innerHTML = html;
        }

        function descartarCarreraPendiente(idCarrera) {
            detenerAlarmaPersistente();
            var idStr = String(idCarrera);
            if (carrerasDescartadasIds.indexOf(idStr) === -1) {
                carrerasDescartadasIds.push(idStr);
            }
            cargarDatosConductor();
        }

        function restaurarCarreraDescartada(idCarrera) {
            var idStr = String(idCarrera);
            carrerasDescartadasIds = carrerasDescartadasIds.filter(function (item) {
                return String(item) !== idStr;
            });
            cargarDatosConductor();
        }

        function alternarDescartadasActivas() {
            descartadasExpandida = !descartadasExpandida;
            var listaEl = document.getElementById('lista-descartadas-activas');
            var iconoEl = document.getElementById('icono-toggle-descartadas');
            if (listaEl) {
                if (descartadasExpandida) {
                    listaEl.classList.remove('hidden');
                } else {
                    listaEl.classList.add('hidden');
                }
            }
            if (iconoEl) {
                iconoEl.textContent = descartadasExpandida ? '▲' : '▼';
            }
        }

        function cargarDatosConductor() {
            var db = getDb();
            if (!db || !conductorActual) return;

            db.from('carreras')
                .select('*')
                .eq('estado', 'pendiente')
                .order('created_at', { ascending: false })
                .then(function (resPend) {
                    if (resPend.error) return;
                    var rawPendData = resPend.data || [];
                    var pendData = rawPendData.filter(function (c) {
                        return carrerasDescartadasIds.indexOf(String(c.id)) === -1;
                    });
                    var descartadasActivasData = rawPendData.filter(function (c) {
                        return carrerasDescartadasIds.indexOf(String(c.id)) !== -1;
                    });

                    var mapaActual = {};
                    var nuevasCarreras = [];
                    for (var i = 0; i < pendData.length; i++) {
                        var item = pendData[i];
                        var idKey = String(item.id);
                        mapaActual[idKey] = true;
                        if (primeraCargaRealizada && !idsPendientesConocidos[idKey]) {
                            nuevasCarreras.push(item);
                        }
                    }

                    idsPendientesConocidos = mapaActual;
                    if (!primeraCargaRealizada) {
                        primeraCargaRealizada = true;
                    } else if (nuevasCarreras.length > 0) {
                        iniciarAlarmaPersistente(pendData.length, nuevasCarreras[0]);
                    } else if (pendData.length === 0) {
                        detenerAlarmaPersistente();
                    }

                    renderizarPendientes(pendData);
                    renderizarDescartadasActivas(descartadasActivasData);
                })
                .catch(function () {});

            db.from('carreras')
                .select('*')
                .eq('estado', 'asignada')
                .eq('conductor_asignado', conductorActual)
                .then(function (resAsig) {
                    if (resAsig.error) return;
                    renderizarAsignada(resAsig.data || []);
                })
                .catch(function () {});

            if (historialVisible) {
                cargarHistorialConductor();
            }
        }

        function tomarCarrera(idCarrera) {
            detenerAlarmaPersistente();
            var idStr = String(idCarrera);
            carrerasDescartadasIds = carrerasDescartadasIds.filter(function (item) {
                return String(item) !== idStr;
            });

            var db = getDb();
            if (!db) return;

            var payload = {
                estado: 'asignada',
                conductor_asignado: conductorActual
            };
            if (conductorIdActual) {
                payload.conductor_id = conductorIdActual;
            }

            db.from('carreras')
                .update(payload)
                .eq('id', idCarrera)
                .then(function (res) {
                    if (res.error) {
                        alert('Error al tomar la carrera: ' + res.error.message);
                    } else {
                        cargarDatosConductor();
                    }
                });
        }

        function renderizarAsignada(asignadas) {
            var seccionAsignada = document.getElementById('seccion-asignada');
            var contenedor = document.getElementById('carrera-asignada-container');

            if (!asignadas || asignadas.length === 0) {
                seccionAsignada.classList.add('hidden');
                contenedor.innerHTML = '';
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            seccionAsignada.classList.remove('hidden');
            contenedor.innerHTML = '';

            asignadas.forEach(function (c) {
                var urlNavegacionBase = 'https://www.google.com/maps/dir/?api=1&origin=' + baseLat + ',' + baseLng + '&destination=' + encodeURIComponent(c.origen) + '&travelmode=driving';
                var urlNavegacionDestino = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(c.origen) + '&destination=' + encodeURIComponent(c.destino) + '&travelmode=driving';

                var tiempos = c.tiempos || {};
                var yaLlego = tiempos.llegada_conductor_at != null;
                var carreraIniciada = tiempos.inicio_carrera_at != null;
                var recorridoFinalizado = tiempos.fin_recorrido_at != null;

                var contenidoAcciones = '';

                if (!yaLlego) {
                    contenidoAcciones =
                        '<a href="' + urlNavegacionBase + '" target="_blank">🧭 Navegar desde Base al Origen</a>' +
                        '<button type="button" onclick=\'conductorLlego("' + c.id + '", ' + JSON.stringify(tiempos) + ')\'>📍 Ya estoy en el lugar</button>';
                } else if (!carreraIniciada) {
                    contenidoAcciones =
                        '<p>⏱️ Tiempo de espera: <strong id="cronometro-conductor">00:00</strong></p>' +
                        '<button type="button" onclick=\'iniciarCarrera("' + c.id + '", ' + JSON.stringify(tiempos) + ')\'>🚀 Iniciar Carrera</button>';
                } else if (!recorridoFinalizado) {
                    contenidoAcciones =
                        '<p>⏱️ Tiempo de viaje: <strong id="cronometro-viaje">00:00</strong></p>' +
                        '<a href="' + urlNavegacionDestino + '" target="_blank">🗺️ Navegar al destino</a>' +
                        '<button type="button" onclick=\'finalizarRecorrido("' + c.id + '", ' + JSON.stringify(tiempos) + ')\'>📍 Finalizar Recorrido (Llegamos al Destino)</button>';
                } else {
                    contenidoAcciones =
                        '<p><strong>💳 Confirmación de Pago: ' + (c.precio || '$0.00') + '</strong></p>' +
                        '<button type="button" onclick=\'confirmarPagoYFinalizar("' + c.id + '", ' + JSON.stringify(tiempos) + ')\'>✅ Confirmar Pago y Finalizar Servicio</button>';
                }

                contenedor.innerHTML +=
                    '<div>' +
                        '<p><strong>✅ Asignada a ti — ' + (c.precio || '$0.00') + '</strong></p>' +
                        '<p>👤 Cliente: ' + (c.cliente_nombre || 'N/A') + '</p>' +
                        '<p>📍 Origen: ' + c.origen + '</p>' +
                        '<p>🏁 Destino: ' + c.destino + '</p>' +
                        '<p>Distancia: ' + (c.distancia || 'N/A') + '</p>' +
                        contenidoAcciones +
                    '</div>';

                if (yaLlego && !carreraIniciada) {
                    iniciarCronometro(tiempos.llegada_conductor_at, 'cronometro-conductor');
                } else if (carreraIniciada && !recorridoFinalizado) {
                    iniciarCronometro(tiempos.inicio_carrera_at, 'cronometro-viaje');
                }
            });
        }

        function actualizarTiemposCarrera(idCarrera, tiemposActuales, campoNuevo, finalizarCompleta) {
            var db = getDb();
            if (!db) return;

            var ahora = new Date().toISOString();
            var nuevosTiempos = Object.assign({}, (typeof tiemposActuales === 'object' && tiemposActuales !== null ? tiemposActuales : {}));
            nuevosTiempos[campoNuevo] = ahora;

            var updateData = { tiempos: nuevosTiempos };
            if (finalizarCompleta) {
                updateData.estado = 'completada';
            }

            db.from('carreras').update(updateData).eq('id', idCarrera).then(function (res) {
                if (res.error) {
                    alert('Error al actualizar: ' + res.error.message);
                } else if (finalizarCompleta) {
                    alert('¡Servicio finalizado y cobro confirmado con éxito!');
                    window.location.replace('./app.html');
                } else {
                    cargarDatosConductor();
                }
            });
        }

        function conductorLlego(idCarrera, tiemposActuales) {
            actualizarTiemposCarrera(idCarrera, tiemposActuales, 'llegada_conductor_at', false);
        }

        function iniciarCarrera(idCarrera, tiemposActuales) {
            if (timerInterval) clearInterval(timerInterval);
            actualizarTiemposCarrera(idCarrera, tiemposActuales, 'inicio_carrera_at', false);
        }

        function finalizarRecorrido(idCarrera, tiemposActuales) {
            if (timerInterval) clearInterval(timerInterval);
            actualizarTiemposCarrera(idCarrera, tiemposActuales, 'fin_recorrido_at', false);
        }

        function confirmarPagoYFinalizar(idCarrera, tiemposActuales) {
            if (!confirm('¿Confirmas que el pasajero pagó y deseas finalizar el servicio por completo?')) return;
            actualizarTiemposCarrera(idCarrera, tiemposActuales, 'fin_carrera_at', true);
        }

        function iniciarCronometro(isoStringInicio, elementoId) {
            if (timerInterval) clearInterval(timerInterval);
            var tiempoInicio = new Date(isoStringInicio).getTime();
            timerInterval = setInterval(function () {
                var ahora = new Date().getTime();
                var diferenciaSecs = Math.floor((ahora - tiempoInicio) / 1000);
                if (diferenciaSecs >= 0) {
                    var mins = Math.floor(diferenciaSecs / 60).toString().padStart(2, '0');
                    var secs = (diferenciaSecs % 60).toString().padStart(2, '0');
                    var el = document.getElementById(elementoId);
                    if (el) el.textContent = mins + ':' + secs;
                }
            }, 1000);
        }

        function renderizarPendientes(carreras) {
            var contenedor = document.getElementById('lista-carreras');
            contenedor.innerHTML = '';

            if (!carreras || carreras.length === 0) {
                contenedor.innerHTML = '<div>No hay carreras pendientes en este momento.</div>';
                return;
            }

            carreras.forEach(function (c) {
                contenedor.innerHTML +=
                    '<div class="tarjeta-carrera-pendiente">' +
                        '<div class="cabecera-pendiente">' +
                            '<p style="margin:0;"><strong>Pendiente — ' + (c.precio || '$0.00') + '</strong></p>' +
                            '<button type="button" class="btn-descartar-mini" onclick="descartarCarreraPendiente(\'' + c.id + '\')">Descartar</button>' +
                        '</div>' +
                        '<p>👤 Cliente: ' + (c.cliente_nombre || 'N/A') + '</p>' +
                        '<p>📍 Origen: ' + c.origen + '</p>' +
                        '<p>🏁 Destino: ' + c.destino + '</p>' +
                        '<p>Distancia: ' + (c.distancia || 'N/A') + '</p>' +
                        '<button type="button" onclick="tomarCarrera(\'' + c.id + '\')" style="width:100%; background-color:#9333ea;">🙋‍♂️ Tomar esta Carrera</button>' +
                    '</div>';
            });
        }

        function renderizarDescartadasActivas(carrerasDescartadas) {
            var contadorEl = document.getElementById('contador-descartadas-activas');
            var contenedor = document.getElementById('lista-descartadas-activas');
            var lista = carrerasDescartadas || [];

            if (contadorEl) {
                contadorEl.textContent = String(lista.length);
            }
            if (!contenedor) return;

            if (lista.length === 0) {
                contenedor.innerHTML = '<div style="margin-top:8px; color:#94a3b8; font-size:13px;">No hay carreras descartadas activas.</div>';
                return;
            }

            var html = '<div style="margin-top:8px;">';
            lista.forEach(function (c) {
                html +=
                    '<div class="tarjeta-carrera-descartada">' +
                        '<p style="margin:0 0 4px 0;"><strong>Descartada Activa — ' + (c.precio || '$0.00') + '</strong></p>' +
                        '<p>👤 Cliente: ' + (c.cliente_nombre || 'N/A') + '</p>' +
                        '<p>📍 Origen: ' + c.origen + '</p>' +
                        '<p>🏁 Destino: ' + c.destino + '</p>' +
                        '<p>Distancia: ' + (c.distancia || 'N/A') + '</p>' +
                        '<div class="acciones-descartada">' +
                            '<button type="button" onclick="tomarCarrera(\'' + c.id + '\')" style="flex:1; background-color:#9333ea;">🙋‍♂️ Tomar esta Carrera</button>' +
                            '<button type="button" class="btn-restaurar-mini" onclick="restaurarCarreraDescartada(\'' + c.id + '\')">Restaurar</button>' +
                        '</div>' +
                    '</div>';
            });
            html += '</div>';
            contenedor.innerHTML = html;
        }

        function suscripcionRealtime() {
            var db = getDb();
            if (db && window.supabaseIsRealtime && typeof db.channel === 'function') {
                db.channel('cambios-carreras-conductor-actualizado')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'carreras' }, function () {
                        cargarDatosConductor();
                    })
                    .subscribe();
            }
        }
    </script>
</body>
</html>
