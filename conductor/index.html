<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Panel de Conductores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <style>
        input, select { font-size: 16px !important; }
        @media (min-width: 640px) { input, select { font-size: 0.85rem !important; } }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased p-3 sm:p-6">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Identificación del Conductor -->
        <header class="flex flex-col sm:flex-row justify-between items-center border-b border-[#222222] pb-4 gap-3">
            <div>
                <h1 class="text-xl font-extrabold text-purple-500 tracking-tight">EN-VIA - Panel de Chofer</h1>
                <p class="text-slate-400 text-xs">Carreras disponibles en tiempo real</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="text" id="nombre-conductor" placeholder="Tu Nombre de Chofer..." class="bg-[#161616] border border-[#2e2e2e] focus:border-purple-500 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
                <a href="../index.html" class="px-3 py-1.5 bg-[#161616] hover:bg-[#222222] border border-[#2e2e2e] text-xs font-medium rounded-xl transition">Salir</a>
            </div>
        </header>

        <!-- Lista de Carreras Disponibles -->
        <div class="space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Carreras Pendientes para Tomar</h2>
            <div id="lista-carreras" class="grid grid-cols-1 gap-3">
                <!-- Se llena dinámicamente en tiempo real -->
                <div class="bg-[#111111] border border-[#222222] p-4 rounded-2xl text-center text-slate-500 italic text-xs">
                    Buscando carreras en tiempo real...
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarCarrerasPendientes();
            suscripcionRealtime();
        });

        async function cargarCarrerasPendientes() {
            const { data, error } = await supabaseClient
                .from('carreras')
                .select('*')
                .eq('estado', 'pendiente')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error al cargar carreras:", error);
                return;
            }

            renderizarCarreras(data);
        }

        function renderizarCarreras(carreras) {
            const contenedor = document.getElementById('lista-carreras');
            contenedor.innerHTML = '';

            if (!carreras || carreras.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-[#111111] border border-[#222222] p-6 rounded-2xl text-center text-slate-500 italic text-xs">
                        No hay carreras pendientes en este momento. Esperando solicitudes...
                    </div>
                `;
                return;
            }

            carreras.forEach(c => {
                contenedor.innerHTML += `
                    <div class="bg-[#111111] border border-[#222222] hover:border-purple-500/40 p-4 rounded-2xl shadow-xl transition space-y-3">
                        <div class="flex justify-between items-start text-xs">
                            <span class="px-2.5 py-1 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20 font-bold uppercase">Pendiente</span>
                            <span class="text-emerald-400 font-bold text-sm">${c.precio || '$0.00'}</span>
                        </div>
                        
                        <div class="space-y-1 text-xs">
                            <p class="text-slate-300"><strong class="text-slate-400">📍 Origen:</strong> ${c.origen}</p>
                            <p class="text-slate-300"><strong class="text-slate-400">🏁 Destino:</strong> ${c.destino}</p>
                            <p class="text-slate-400"><strong class="text-slate-500">Distancia:</strong> ${c.distancia || 'N/A'}</p>
                        </div>

                        <button onclick="tomarCarrera('${c.id}')" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl transition shadow-lg cursor-pointer">
                            🚀 ¡Tomar esta Carrera!
                        </button>
                    </div>
                `;
            });
        }

        // Tomar la carrera de forma exclusiva y actualizar Supabase
        async function tomarCarrera(idCarrera) {
            const nombreChofer = document.getElementById('nombre-conductor').value.trim();
            if (!nombreChofer) {
                alert('Por favor, ingresa tu nombre de chofer en la parte superior antes de tomar una carrera.');
                document.getElementById('nombre-conductor').focus();
                return;
            }

            // Cambiamos el estatus a 'asignada' y guardamos el conductor asignado
            const { error } = await supabaseClient
                .from('carreras')
                .update({ 
                    estado: 'asignada', 
                    conductor_asignado: nombreChofer 
                })
                .eq('id', idCarrera)
                .eq('estado', 'pendiente'); // Validación de seguridad: solo si sigue pendiente

            if (error) {
                alert('Error al tomar la carrera: ' + error.message);
            } else {
                alert('¡Has tomado la carrera con éxito!');
                cargarCarrerasPendientes();
            }
        }

        // Suscripción en Tiempo Real con Supabase Realtime
        function suscripcionRealtime() {
            supabaseClient
                .channel('cambios-carreras')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'carreras' }, payload => {
                    console.log('Cambio detectado en tiempo real:', payload);
                    // Recargamos la lista automáticamente cuando cualquier conductor tome una o se cree una nueva
                    cargarCarrerasPendientes();
                })
                .subscribe();
        }
    </script>
</body>
</html>
