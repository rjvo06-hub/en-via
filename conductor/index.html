<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Acceso y Registro de Conductor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/supabaseClient.js"></script>
    <script>
        var DIRECT_SUPABASE_URL = window.SUPABASE_URL || 'https://sgpwdejwfbqsswoibohu.supabase.co';
        var DIRECT_SUPABASE_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_891ubyEIooQ7Ik7vdEACZQ_vfXcW37g';

        if (!window.supabaseClient) {
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                window.supabaseClient = supabaseClient;
            } else if (window.supabase && typeof window.supabase.createClient === 'function') {
                window.supabaseClient = window.supabase.createClient(DIRECT_SUPABASE_URL, DIRECT_SUPABASE_KEY);
                window.supabaseIsRealtime = true;
            }
        }
    </script>
    <style>
        input, select, textarea { font-size: 16px !important; }
        @media (min-width: 640px) { input, select, textarea { font-size: 0.85rem !important; } }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased p-3 sm:p-6 flex items-center justify-center">
    <div class="w-full max-w-md space-y-5">
        <header class="flex justify-between items-center border-b border-[#222222] pb-4">
            <div>
                <h1 class="text-xl font-extrabold text-emerald-500 tracking-tight">EN-VIA - Conductores</h1>
                <p class="text-slate-400 text-xs">Inicia sesión o regístrate como nuevo conductor</p>
            </div>
            <a href="../index.html" class="px-3 py-1.5 bg-[#161616] hover:bg-[#222222] border border-[#2e2e2e] text-xs font-medium rounded-xl transition">
                ← Menú
            </a>
        </header>

        <!-- Selector visible de Inicio de Sesión / Registro -->
        <div class="grid grid-cols-2 gap-2 bg-[#111111] border border-[#222222] p-1.5 rounded-2xl">
            <button type="button" id="tab-login" onclick="enfocarLogin()" class="py-2 bg-purple-600 text-white font-bold text-xs rounded-xl transition cursor-pointer">
                Iniciar Sesión
            </button>
            <a href="./registro.html" id="tab-registro" class="py-2 bg-[#161616] hover:bg-[#222222] text-emerald-400 font-bold text-xs rounded-xl transition text-center flex items-center justify-center">
                Registrarse
            </a>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <form id="form-login-conductor" onsubmit="ingresarAlPortal(event)" class="bg-[#111111] border border-[#222222] p-4 sm:p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-purple-400">Iniciar Sesión</h2>

            <div>
                <label for="login-nombre" class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Usuario del Conductor *</label>
                <input type="text" id="login-nombre" required placeholder="Ej. rdiaz" autocomplete="username" autocapitalize="none" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-purple-500 rounded-xl px-3 py-2 text-white outline-none">
            </div>

            <div>
                <label for="login-clave" class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Clave de Acceso *</label>
                <input type="password" id="login-clave" required placeholder="Tu clave de acceso" autocomplete="current-password" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-purple-500 rounded-xl px-3 py-2 text-white outline-none">
            </div>

            <div id="login-error" class="hidden text-xs rounded-xl p-3 border bg-red-500/10 text-red-300 border-red-500/30"></div>

            <button type="submit" id="btn-entrar-portal" class="w-full py-3 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl transition shadow-lg cursor-pointer">
                Entrar al Portal
            </button>

            <div class="pt-3 border-t border-[#222222] text-center space-y-2">
                <p class="text-xs text-slate-400">¿No tienes cuenta todavía?</p>
                <a href="./registro.html" class="inline-block w-full py-2.5 bg-[#161616] hover:bg-[#222222] border border-emerald-500/40 text-emerald-400 font-bold text-xs rounded-xl transition">
                    Ir a Registro de Conductor
                </a>
            </div>
        </form>
    </div>

    <script>
        function enfocarLogin() {
            var inputUser = document.getElementById('login-nombre');
            if (inputUser) inputUser.focus();
        }

        function getDb() {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                window.supabaseClient = supabaseClient;
                return supabaseClient;
            }
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                window.supabaseClient = window.supabase.createClient(DIRECT_SUPABASE_URL, DIRECT_SUPABASE_KEY);
                window.supabaseIsRealtime = true;
                return window.supabaseClient;
            }
            return null;
        }

        function hashFallbackSimple(texto) {
            var h1 = 0xdeadbeef ^ texto.length;
            var h2 = 0x41c6ce57 ^ texto.length;
            for (var i = 0; i < texto.length; i++) {
                var ch = texto.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
        }

        async function generarHashClaveLogin(clave) {
            try {
                if (window.crypto && window.crypto.subtle && window.TextEncoder) {
                    var encoder = new TextEncoder();
                    var data = encoder.encode(clave);
                    var hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
                    var hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
                }
            } catch (e) {}
            return hashFallbackSimple(clave);
        }

        function normalizarUsuarioEntrada(valor) {
            if (!valor) return '';
            var limpio = String(valor).replace(/^\s+|\s+$/g, '').toLowerCase();
            if (limpio.indexOf(' ') !== -1 && window.EnviaAuth && typeof window.EnviaAuth.generarUsuarioDesdeNombre === 'function') {
                return window.EnviaAuth.generarUsuarioDesdeNombre(limpio);
            }
            return limpio.replace(/\s+/g, '');
        }

        function mostrarErrorLogin(msg) {
            var errEl = document.getElementById('login-error');
            if (errEl) {
                errEl.textContent = msg;
                errEl.classList.remove('hidden');
            }
        }

        function limpiarErrorLogin() {
            var errEl = document.getElementById('login-error');
            if (errEl) {
                errEl.textContent = '';
                errEl.classList.add('hidden');
            }
        }

        async function consultarConductorDirecto(db, usuarioInput, claveInput) {
            var hashSha = await generarHashClaveLogin(claveInput);
            var hashSimple = hashFallbackSimple(claveInput);

            if (db && typeof db.from === 'function') {
                var res = await db.from('conductores')
                    .select('id, nombre, usuario, clave_hash, activo')
                    .ilike('usuario', usuarioInput)
                    .limit(1);

                if (!res.error && res.data && res.data.length > 0) {
                    var cond = res.data[0];
                    var guardado = (cond.clave_hash || '').trim();
                    var coincide = guardado !== '' && (
                        guardado.toLowerCase() === hashSha.toLowerCase() ||
                        guardado === hashSimple ||
                        guardado === claveInput
                    );
                    if (!coincide) {
                        return { errorMsg: 'Usuario o clave incorrectos.' };
                    }
                    if (cond.activo !== true) {
                        return { errorMsg: 'Tu cuenta de conductor aún no está activa. Contacta al administrador.' };
                    }
                    return { conductor: cond };
                }
            }

            var restUrl = DIRECT_SUPABASE_URL.replace(/\/+$/, '') +
                '/rest/v1/conductores?select=id,nombre,usuario,clave_hash,activo&usuario=ilike.' +
                encodeURIComponent(usuarioInput) + '&limit=1';
            var resp = await window.fetch(restUrl, {
                method: 'GET',
                headers: {
                    'apikey': DIRECT_SUPABASE_KEY,
                    'Authorization': 'Bearer ' + DIRECT_SUPABASE_KEY,
                    'Content-Type': 'application/json'
                }
            });
            if (resp.ok) {
                var rows = await resp.json().catch(function () { return []; });
                if (Array.isArray(rows) && rows.length > 0) {
                    var condRest = rows[0];
                    var guardadoRest = (condRest.clave_hash || '').trim();
                    var coincideRest = guardadoRest !== '' && (
                        guardadoRest.toLowerCase() === hashSha.toLowerCase() ||
                        guardadoRest === hashSimple ||
                        guardadoRest === claveInput
                    );
                    if (!coincideRest) {
                        return { errorMsg: 'Usuario o clave incorrectos.' };
                    }
                    if (condRest.activo !== true) {
                        return { errorMsg: 'Tu cuenta de conductor aún no está activa. Contacta al administrador.' };
                    }
                    return { conductor: condRest };
                }
            }

            return { notFound: true };
        }

        function irAAppConductor(cond) {
            sessionStorage.setItem('conductor_en_via', cond.nombre);
            sessionStorage.setItem('conductor_id_en_via', cond.id);
            window.location.replace('./app.html');
        }

        async function ingresarAlPortal(event) {
            if (event) event.preventDefault();
            limpiarErrorLogin();

            var btn = document.getElementById('btn-entrar-portal');
            var usuarioInput = normalizarUsuarioEntrada(document.getElementById('login-nombre').value || '');
            var claveInput = document.getElementById('login-clave').value || '';
            var db = getDb();

            if (!usuarioInput || !claveInput) {
                mostrarErrorLogin('Ingresa tu usuario y clave de acceso.');
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Verificando...';
            }

            try {
                var directo = await consultarConductorDirecto(db, usuarioInput, claveInput);
                if (directo && directo.conductor) {
                    irAAppConductor(directo.conductor);
                    return;
                }
                if (directo && directo.errorMsg) {
                    mostrarErrorLogin(directo.errorMsg);
                    return;
                }

                if (db && typeof db.rpc === 'function') {
                    var res = await db.rpc('verificar_login_conductor', {
                        p_usuario: usuarioInput,
                        p_clave: claveInput
                    });
                    var rows = res ? res.data : null;
                    var cond = Array.isArray(rows) ? rows[0] : rows;

                    if (cond && cond.id && cond.activo === true) {
                        irAAppConductor(cond);
                        return;
                    }
                }

                mostrarErrorLogin('Usuario o clave incorrectos, o conductor inactivo.');
            } catch (e) {
                mostrarErrorLogin('Usuario o clave incorrectos, o conductor inactivo.');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Entrar al Portal';
                }
            }
        }
    </script>
</body>
</html>
