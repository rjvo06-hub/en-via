<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Registro de Conductor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabaseClient.js"></script>
    <style>
        input, select, textarea { font-size: 16px !important; }
        @media (min-width: 640px) { input, select, textarea { font-size: 0.85rem !important; } }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased p-3 sm:p-6">

    <div class="max-w-2xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-[#222222] pb-4">
            <div>
                <h1 class="text-xl font-extrabold text-emerald-500 tracking-tight">EN-VIA - Registro de Conductor</h1>
                <p class="text-slate-400 text-xs">Completa tus datos de acceso, contacto y cobro</p>
            </div>
            <a href="./index.html" class="px-3 py-1.5 bg-[#161616] hover:bg-[#222222] border border-[#2e2e2e] text-xs font-medium rounded-xl transition">
                ← Ir al Acceso
            </a>
        </header>

        <form id="form-registro-conductor" onsubmit="registrarConductor(event)" class="bg-[#111111] border border-[#222222] p-4 sm:p-6 rounded-2xl shadow-xl space-y-5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Datos Personales y Acceso</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej. Carlos Pérez" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Teléfono Personal *</label>
                    <input type="text" id="telefono" required placeholder="Ej. 0414-1234567" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Usuario de Acceso *</label>
                    <input type="text" id="usuario" required placeholder="Ej. cperez" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Clave de Acceso *</label>
                    <input type="password" id="clave" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-[#222222]">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">Datos Bancarios y Código QR</h2>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Banco</label>
                        <input type="text" id="banco" placeholder="Ej. Banesco" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Teléfono (Pago Móvil)</label>
                        <input type="text" id="banco-telefono" placeholder="Ej. 04121234567" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Cédula / RIF</label>
                        <input type="text" id="banco-cedula" placeholder="Ej. V12345678" class="w-full bg-[#161616] border border-[#2e2e2e] focus:border-emerald-500 rounded-xl px-3 py-2 text-white outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Imagen del QR del Banco (Subir archivo)</label>
                    <input type="file" id="qr-file" accept="image/*" class="w-full bg-[#161616] border border-[#2e2e2e] rounded-xl p-2 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    <p class="text-[10px] text-slate-500 mt-1">Sube la foto del QR del banco; se guardará automáticamente en la nube.</p>
                </div>
            </div>

            <div id="mensaje-estado" class="hidden text-xs rounded-xl p-3 border"></div>

            <button type="submit" id="btn-registrar" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold text-xs rounded-xl transition shadow-lg cursor-pointer">
                Completar Registro
            </button>
        </form>
    </div>

    <script>
        var DIRECT_SUPABASE_URL = window.SUPABASE_URL || 'https://sgpwdejwfbqsswoibohu.supabase.co';
        var DIRECT_SUPABASE_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_891ubyEIooQ7Ik7vdEACZQ_vfXcW37g';

        function obtenerDb() {
            if (window.supabaseClient) {
                return window.supabaseClient;
            }
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                window.supabaseClient = supabaseClient;
                return supabaseClient;
            }
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                window.supabaseClient = window.supabase.createClient(DIRECT_SUPABASE_URL, DIRECT_SUPABASE_KEY);
                return window.supabaseClient;
            }
            throw new Error('No hay conexión disponible con Supabase en este dispositivo.');
        }

        function hashFallbackSimple(texto) {
            var h1 = 0xdeadbeef ^ texto.length;
            var h2 = 0x41c6ce57 ^ texto.length;
            for (var i = 0; i < texto.length; i++) {
                var ch = texto.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
        }

        async function generarHashClave(clave) {
            try {
                if (window.crypto && window.crypto.subtle && window.TextEncoder) {
                    var encoder = new TextEncoder();
                    var data = encoder.encode(clave);
                    var hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
                    var hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
                }
            } catch (e) {}
            return hashFallbackSimple(clave);
        }

        async function subirQrConRespaldo(db, file, fileName) {
            if (db && db.storage && typeof db.storage.from === 'function') {
                var upRes = await db.storage.from('qr-codes').upload(fileName, file);
                if (upRes.error) {
                    throw new Error('Error al subir el QR: ' + upRes.error.message);
                }
                var pubRes = db.storage.from('qr-codes').getPublicUrl(fileName);
                return pubRes && pubRes.data ? pubRes.data.publicUrl : '';
            }

            var uploadUrl = DIRECT_SUPABASE_URL.replace(/\/+$/, '') + '/storage/v1/object/qr-codes/' + encodeURIComponent(fileName);
            var resp = await window.fetch(uploadUrl, {
                method: 'POST',
                headers: {
                    'apikey': DIRECT_SUPABASE_KEY,
                    'Authorization': 'Bearer ' + DIRECT_SUPABASE_KEY,
                    'Content-Type': file.type || 'application/octet-stream',
                    'x-upsert': 'true'
                },
                body: file
            });
            if (!resp.ok) {
                var errJson = await resp.json().catch(function () { return {}; });
                throw new Error('Error al subir el QR: ' + (errJson.message || resp.statusText));
            }
            return DIRECT_SUPABASE_URL.replace(/\/+$/, '') + '/storage/v1/object/public/qr-codes/' + encodeURIComponent(fileName);
        }

        async function insertarConductorConRespaldo(db, payload) {
            if (db && typeof db.from === 'function') {
                return await db.from('conductores').insert([payload]);
            }

            var restUrl = DIRECT_SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/conductores';
            var resp = await window.fetch(restUrl, {
                method: 'POST',
                headers: {
                    'apikey': DIRECT_SUPABASE_KEY,
                    'Authorization': 'Bearer ' + DIRECT_SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify([payload])
            });
            var json = await resp.json().catch(function () { return null; });
            if (!resp.ok) {
                return { data: null, error: { message: (json && json.message) || resp.statusText } };
            }
            return { data: json, error: null };
        }

        function mostrarMensaje(texto, tipo) {
            var box = document.getElementById('mensaje-estado');
            box.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-300', 'border-emerald-500/30', 'bg-red-500/10', 'text-red-300', 'border-red-500/30');
            if (tipo === 'exito') {
                box.classList.add('bg-emerald-500/10', 'text-emerald-300', 'border-emerald-500/30');
            } else {
                box.classList.add('bg-red-500/10', 'text-red-300', 'border-red-500/30');
            }
            box.textContent = texto;
        }

        async function registrarConductor(event) {
            event.preventDefault();

            var btn = document.getElementById('btn-registrar');
            var nombre = document.getElementById('nombre').value.trim();
            var telefono = document.getElementById('telefono').value.trim();
            var usuario = document.getElementById('usuario').value.trim().toLowerCase();
            var clave = document.getElementById('clave').value;
            var banco = document.getElementById('banco').value.trim();
            var bancoTelefono = document.getElementById('banco-telefono').value.trim();
            var bancoCedula = document.getElementById('banco-cedula').value.trim();
            var fileInput = document.getElementById('qr-file');

            if (!nombre || !telefono || !usuario || !clave) {
                mostrarMensaje('Por favor completa nombre, teléfono, usuario y clave.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Enviando registro...';

            try {
                var db = obtenerDb();
                var qrUrl = '';

                if (fileInput.files && fileInput.files[0]) {
                    var file = fileInput.files[0];
                    var partesNombre = file.name.split('.');
                    var fileExt = partesNombre.length > 1 ? partesNombre.pop() : 'png';
                    var fileName = 'qr_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + '.' + fileExt;
                    qrUrl = await subirQrConRespaldo(db, file, fileName);
                }

                var claveHash = await generarHashClave(clave);

                var datos_bancarios = {
                    banco: banco,
                    telefono: bancoTelefono,
                    cedula_rif: bancoCedula,
                    qr_url: qrUrl
                };

                var resInsert = await insertarConductorConRespaldo(db, {
                    nombre: nombre,
                    telefono: telefono,
                    usuario: usuario,
                    clave_hash: claveHash,
                    activo: false,
                    datos_bancarios: datos_bancarios
                });

                if (resInsert.error) {
                    throw new Error('No se pudo guardar el registro: ' + resInsert.error.message);
                }

                document.getElementById('form-registro-conductor').reset();
                mostrarMensaje('¡Registro enviado con éxito! Queda pendiente de activación.', 'exito');
            } catch (err) {
                mostrarMensaje(err.message || 'Ocurrió un error al registrar.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Completar Registro';
            }
        }
    </script>
</body>
</html>
