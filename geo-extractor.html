<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-EXTRACTOR - EN-VIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geocoding" async defer></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="text-center space-y-3">
        <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="estado-extractor" class="text-sm font-medium text-slate-300">Extrayendo coordenadas de forma independiente...</p>
    </div>

    <script>
        window.addEventListener('load', () => {
            const checkGoogle = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkGoogle);

                    const geocoder = new google.maps.Geocoder();
                    const rawData = localStorage.getItem('en_via_objetivo');

                    if (!rawData) {
                        window.location.href = 'index.html';
                        return;
                    }

                    const target = JSON.parse(rawData);

                    geocoder.geocode({ address: target.direccion }, (results, status) => {
                        if (status === 'OK' && results[0]) {
                            const loc = results[0].geometry.location;
                            
                            const respuesta = {
                                direccion: target.direccion,
                                tipo: target.tipo,
                                lat: loc.lat().toFixed(6),
                                lng: loc.lng().toFixed(6)
                            };

                            localStorage.setItem('en_via_resultado_coord', JSON.stringify(respuesta));
                            localStorage.removeItem('en_via_objetivo');

                            document.getElementById('estado-extractor').textContent = "¡Listo! Regresando al panel...";

                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 300);
                        } else {
                            alert("No se pudo extraer coordenadas para la dirección solicitada.");
                            window.location.href = 'index.html';
                        }
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
