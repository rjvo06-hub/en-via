<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-EXTRACTOR - EN-VIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geocoding" async defer></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="text-center space-y-3">
        <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="estado-extractor" class="text-sm font-medium text-slate-300">Procesando dirección y extrayendo coordenadas...</p>
    </div>

    <script>
        window.addEventListener('load', () => {
            const checkGoogle = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkGoogle);

                    const geocoder = new google.maps.Geocoder();
                    
                    // Leer el dato enviado automáticamente desde el index
                    const direccionAProcesar = localStorage.getItem('en_via_objetivo');

                    if (!direccionAProcesar) {
                        window.location.href = 'index.html';
                        return;
                    }

                    // Extraer coordenadas de forma totalmente autónoma
                    geocoder.geocode({ address: direccionAProcesar }, (results, status) => {
                        if (status === 'OK' && results[0]) {
                            const location = results[0].geometry.location;
                            const lat = location.lat();
                            const lng = location.lng();

                            // Guardar los resultados listos para que index los muestre
                            const resultadoFinal = {
                                direccion: direccionAProcesar,
                                lat: lat.toFixed(6),
                                lng: lng.toFixed(6)
                            };
                            
                            localStorage.setItem('en_via_ultima_coordenada', JSON.stringify(resultadoFinal));
                            localStorage.removeItem('en_via_objetivo');

                            document.getElementById('estado-extractor').textContent = "¡Coordenadas extraídas! Regresando al panel...";

                            // Regresar automáticamente al index principal
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 400);
                        } else {
                            alert("No se pudo extraer coordenadas para: " + direccionAProcesar);
                            window.location.href = 'index.html';
                        }
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
