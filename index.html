<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Rutas y Coordenadas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places y Geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        gmp-place-autocomplete { width: 100%; }
        gmp-place-autocomplete input {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #1e293b;
            outline: none;
        }
        gmp-place-autocomplete input:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-600 mt-1">Selecciona una dirección para extraer sus coordenadas y trazar la ruta.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" id="origen" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" id="destino" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-800">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-xl shadow-md lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div id="status-msg" class="text-slate-600 text-sm text-center italic">
                    Selecciona una dirección de origen o destino para iniciar.
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integración y Retorno -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            // 1. Revisar si acabamos de regresar del geo-extractor con las coordenadas listas
            const datosRegresados = localStorage.getItem('en_via_resultado_coord');
            if (datosRegresados) {
                const res = JSON.parse(datosRegresados);
                if (res && res.tipo === 'origen') {
                    document.getElementById('origen').value = res.direccion;
                    document.getElementById('origin-lat').textContent = res.lat;
                    document.getElementById('origin-lon').textContent = res.lng;
                    document.getElementById('btn-copy-origin').classList.remove('hidden');
                    origenCoords = { lat: parseFloat(res.lat), lng: parseFloat(res.lng) };
                    updateMarker('origin', origenCoords);
                } else if (res && res.tipo === 'destino') {
                    document.getElementById('destino').value = res.direccion;
                    document.getElementById('dest-lat').textContent = res.lat;
                    document.getElementById('dest-lon').textContent = res.lng;
                    document.getElementById('btn-copy-dest').classList.remove('hidden');
                    destCoords = { lat: parseFloat(res.lat), lng: parseFloat(res.lng) };
                    updateMarker('dest', destCoords);
                }
                localStorage.removeItem('en_via_resultado_coord');
                verificarYCalcularRuta();
            }

            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });

                    const origenAutocomplete = document.getElementById('origen-autocomplete');
                    const destinoAutocomplete = document.getElementById('destino-autocomplete');

                    // 2. Al seleccionar Origen, empaquetar y saltar al extractor
                    if (origenAutocomplete) {
                        origenAutocomplete.addEventListener('gmp-placeselect', async (e) => {
                            const place = e.detail.place;
                            if (place) {
                                await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
                                const direccion = place.displayName || place.formattedAddress || document.getElementById('origen').value;
                                
                                localStorage.setItem('en_via_objetivo', JSON.stringify({ direccion, tipo: 'origen' }));
                                window.location.href = 'geo-extractor.html';
                            }
                        });
                    }

                    // 3. Al seleccionar Destino, empaquetar y saltar al extractor
                    if (destinoAutocomplete) {
                        destinoAutocomplete.addEventListener('gmp-placeselect', async (e) => {
                            const place = e.detail.place;
                            if (place) {
                                await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
                                const direccion = place.displayName || place.formattedAddress || document.getElementById('destino').value;
                                
                                localStorage.setItem('en_via_objetivo', JSON.stringify({ direccion, tipo: 'destino' }));
                                window.location.href = 'geo-extractor.html';
                            }
                        });
                    }
                }
            }, 300);
        });

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }
            map.setCenter(coord);
            map.setZoom(15);
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta vial...";
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        if (originMarker) originMarker.setMap(null);
                        if (destMarker) destMarker.setMap(null);
                        directionsRenderer.setDirections(response);

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta.";
                    }
                });
            }
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type}-lat`).textContent;
            const lon = document.getElementById(`${type}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
