<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Maps - EN-VIA</title>
    <!-- Tailwind CSS para diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con tu clave actual -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAAHveFriP_VQfvjTskY16o6iEQ_mWz8Ew&libraries=places"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-md space-y-4">
        <h1 class="text-lg font-bold text-slate-800 text-center">Prueba de Autocompletado Maps</h1>
        
        <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Punto de Origen</label>
            <input type="text" id="origen" placeholder="Escribe una dirección..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Destino</label>
            <input type="text" id="destino" placeholder="Escribe otra dirección..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div id="status" class="text-xs text-center text-slate-400 font-medium">Esperando carga de Google Maps...</div>
    </div>

    <!-- Script de inicialización directa -->
    <script>
        window.addEventListener('load', () => {
            const statusEl = document.getElementById('status');
            
            if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                statusEl.textContent = "¡Google Maps cargado correctamente!";
                statusEl.className = "text-xs text-center text-emerald-600 font-bold";

                const inputOrigen = document.getElementById('origen');
                const inputDestino = document.getElementById('destino');

                const opciones = { types: ['geocode', 'establishment'] };

                new google.maps.places.Autocomplete(inputOrigen, opciones);
                new google.maps.places.Autocomplete(inputDestino, opciones);
            } else {
                statusEl.textContent = "Error: Google Maps no se pudo cargar.";
                statusEl.className = "text-xs text-center text-red-600 font-bold";
            }
        });
    </script>
</body>
</html>
