<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places (New) y Geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        gmp-place-autocomplete { width: 100%; }
        gmp-place-autocomplete input {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #1e293b;
            outline: none;
        }
        gmp-place-autocomplete input:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-600 mt-1">Selecciona origen y destino para mostrar coordenadas y trazar la ruta automáticamente.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                    </div>
                </div>

                <!-- Destino -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-800">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-xl shadow-md lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div class="flex flex-wrap gap-3 justify-between items-center text-sm">
                    <div id="status-msg" class="text-slate-600 italic">Selecciona origen y destino para trazar la ruta.</div>
                    <a id="gmaps-link" href="#" target="_blank" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition shadow-sm">
                        Abrir ruta en Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal unificado -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ 
                        map: map, 
                        suppressMarkers: false // Muestra los marcadores oficiales de la ruta de Google
                    });

                    configurarLugar('origen-autocomplete', 'origin-lat', 'origin-lon', 'origin');
                    configurarLugar('destino-autocomplete', 'dest-lat', 'dest-lon', 'dest');
                }
            }, 300);
        });

        function configurarLugar(autocompleteId, latId, lonId, tipo) {
            const autocompleteEl = document.getElementById(autocompleteId);

            if (autocompleteEl) {
                autocompleteEl.addEventListener('gmp-select', async ({ placePrediction }) => {
                    if (!placePrediction) return;

                    const place = placePrediction.toPlace();
                    await place.fetchFields({ fields: ['location'] });

                    const location = place.location;

                    if (location) {
                        const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                        const lng = typeof location.lng === 'function' ? location.lng() : location.lng;

                        document.getElementById(latId).textContent = lat.toFixed(6);
                        document.getElementById(lonId).textContent = lng.toFixed(6);

                        const coords = { lat, lng };
                        if (tipo === 'origin') {
                            origenCoords = coords;
                            updateMarker('origin', coords);
                        } else {
                            destCoords = coords;
                            updateMarker('dest', coords);
                        }

                        verificarYCalcularRuta();
                    }
                });
            }
        }

        function updateMarker(type, coord) {
            // Si ya hay una ruta trazada, limpiamos el renderizador para que no interfiera con los marcadores individuales
            directionsRenderer.set('directions', null);

            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }

            // Si ambos puntos existen, ajustamos los límites para ver ambos; si solo hay uno, centramos en ese
            if (origenCoords && destCoords) {
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(origenCoords);
                bounds.extend(destCoords);
                map.fitBounds(bounds);
            } else {
                map.setCenter(coord);
                map.setZoom(15);
            }
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                // 1. Calcular distancia en línea recta inicial
                const p1 = new google.maps.LatLng(origenCoords.lat, origenCoords.lng);
                const p2 = new google.maps.LatLng(destCoords.lat, destCoords.lng);
                const distanciaMetros = google.maps.geometry.spherical.computeDistanceBetween(p1, p2);
                
                let distanciaTexto = "";
                if (distanciaMetros >= 1000) {
                    distanciaTexto = (distanciaMetros / 1000).toFixed(2) + " km (línea recta)";
                } else {
                    distanciaTexto = Math.round(distanciaMetros) + " m (línea recta)";
                }
                document.getElementById('route-distance').textContent = distanciaTexto;

                // 2. Solicitar ruta vial oficial a Google Maps
                document.getElementById('status-msg').textContent = "Calculando ruta vial con Google...";
                const request = {
                    origin: p1,
                    destination: p2,
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        // Ocultamos los marcadores individuales para que Google Maps muestre los de la ruta completa
                        if (originMarker) originMarker.setMap(null);
                        if (destMarker) destMarker.setMap(null);
                        
                        directionsRenderer.setDirections(response);
                        // El propio DirectionsRenderer ajusta automáticamente el zoom y los límites (bounds) para mostrar toda la ruta y ambos puntos.

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";

                        const gmapsLink = document.getElementById('gmaps-link');
                        gmapsLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origenCoords.lat},${origenCoords.lng}&destination=${destCoords.lat},${destCoords.lng}&travelmode=driving`;
                        gmapsLink.classList.remove('hidden');
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta para estos puntos.";
                    }
                });
            }
        }
    </script>
</body>
</html>
