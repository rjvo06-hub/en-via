<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Coordenadas - Google Maps</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con la nueva Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 400px; width: 100%; }
        gmp-place-autocomplete { width: 100%; }
        gmp-place-autocomplete input {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #1e293b;
            outline: none;
        }
        gmp-place-autocomplete input:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600">Buscador de Coordenadas</h1>
            <p class="text-slate-600 mt-1">Escribe una dirección para desplegar las opciones y obtener su latitud y longitud.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-6">
                
                <!-- Origen -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" id="origen" placeholder="Ej. Sambil Maracaibo..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" id="destino" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-xl shadow-md flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div id="status-msg" class="text-sm text-slate-600 text-center">
                    Selecciona una dirección para ver sus coordenadas.
                </div>
            </div>
        </div>
    </div>

    <!-- Script reforzado para captura inmediata de coordenadas -->
    <script>
        let map;
        let originMarker = null;
        let destMarker = null;
        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    const origenAutocomplete = document.getElementById('origen-autocomplete');
                    const destinoAutocomplete = document.getElementById('destino-autocomplete');

                    // Función auxiliar para procesar la selección del lugar
                    async function procesarLugar(place, type) {
                        if (!place) return;
                        
                        // Si el objeto place es un Place object moderno, obtenemos los campos
                        if (typeof place.fetchFields === 'function') {
                            await place.fetchFields({ fields: ['location', 'displayName', 'formattedAddress'] });
                        }

                        const location = place.location || (place.geometry && place.geometry.location);
                        if (location) {
                            const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                            const lng = typeof location.lng === 'function' ? location.lng() : location.lng;

                            if (type === 'origin') {
                                document.getElementById('origin-lat').textContent = lat.toFixed(6);
                                document.getElementById('origin-lon').textContent = lng.toFixed(6);
                                document.getElementById('btn-copy-origin').classList.remove('hidden');
                                updateMarker('origin', { lat, lng });
                            } else {
                                document.getElementById('dest-lat').textContent = lat.toFixed(6);
                                document.getElementById('dest-lon').textContent = lng.toFixed(6);
                                document.getElementById('btn-copy-dest').classList.remove('hidden');
                                updateMarker('dest', { lat, lng });
                            }
                        }
                    }

                    // Escuchas para Origen
                    if (origenAutocomplete) {
                        origenAutocomplete.addEventListener('gmp-placeselect', async (event) => {
                            await procesarLugar(event.detail.place, 'origin');
                        });
                        origenAutocomplete.addEventListener('place_changed', async () => {
                            await procesarLugar(origenAutocomplete.place, 'origin');
                        });
                    }

                    // Escuchas para Destino
                    if (destinoAutocomplete) {
                        destinoAutocomplete.addEventListener('gmp-placeselect', async (event) => {
                            await procesarLugar(event.detail.place, 'dest');
                        });
                        destinoAutocomplete.addEventListener('place_changed', async () => {
                            await procesarLugar(destinoAutocomplete.place, 'dest');
                        });
                    }
                }
            }, 300);
        });

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) map.removeLayer(originMarker);
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }
            map.setCenter(coord);
            map.setZoom(15);
            document.getElementById('status-msg').textContent = `Coordenadas de ${type === 'origin' ? 'Origen' : 'Destino'} capturadas con éxito.`;
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type}-lat`).textContent;
            const lon = document.getElementById(`${type}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
