<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Coordenadas - Maracaibo</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map { height: 420px; width: 100%; }
        .autocomplete-list {
            position: absolute;
            z-index: 1000;
            width: 100%;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600">Coordenadas de Direcciones</h1>
            <p class="text-slate-600 mt-1">Busca cualquier punto en Maracaibo y obtén su latitud y longitud al instante.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Panel de Entradas -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-6">
                
                <!-- Origen -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Dirección de Origen</label>
                    <input type="text" id="origin-input" placeholder="Ej. Galerías Mall, C2, Bella Vista..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <div id="origin-suggestions" class="autocomplete-list hidden mt-1"></div>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Dirección de Destino</label>
                    <input type="text" id="dest-input" placeholder="Ej. Vereda del Lago, Hospital Coromoto..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <div id="dest-suggestions" class="autocomplete-list hidden mt-1"></div>
                    
                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-200 text-xs text-slate-600 flex justify-between items-center">
                        <div>
                            <span class="font-bold">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-600 hover:underline font-medium">Copiar</button>
                    </div>
                </div>

                <div class="text-xs text-slate-500 italic text-center">
                    * Las sugerencias priorizan Maracaibo, Zulia y zonas aledañas.
                </div>
            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-xl shadow-md flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div id="status-msg" class="text-sm text-slate-600 text-center">
                    Escribe una dirección para visualizarla en el mapa.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Coordenadas iniciales centradas en Maracaibo
        const map = L.map('map').setView([10.6549, -71.6146], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let originMarker = null;
        let destMarker = null;

        const originInput = document.getElementById('origin-input');
        const destInput = document.getElementById('dest-input');
        const originSuggestions = document.getElementById('origin-suggestions');
        const destSuggestions = document.getElementById('dest-suggestions');

        // Búsqueda inteligente con autocompletado ampliado para todo Maracaibo y Zulia
        function setupAutocomplete(inputElement, suggestionsElement, type) {
            let timeout = null;

            inputElement.addEventListener('input', function() {
                clearTimeout(timeout);
                const query = this.value;
                if (query.length < 3) {
                    suggestionsElement.classList.add('hidden');
                    return;
                }

                timeout = setTimeout(() => {
                    // Se añade "Maracaibo Zulia" a la consulta para asegurar que priorice la zona local sin bloquear resultados lejanos
                    const searchQuery = encodeURIComponent(query + " Maracaibo Zulia");
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${searchQuery}&limit=6`;
                    
                    fetch(url)
                        .then(response => response.json())
                        .then(data => {
                            suggestionsElement.innerHTML = '';
                            if (data.length === 0) {
                                suggestionsElement.classList.add('hidden');
                                return;
                            }

                            data.forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'px-4 py-2 hover:bg-slate-100 cursor-pointer text-sm border-b border-slate-100 last:border-none';
                                div.textContent = item.display_name;
                                
                                div.addEventListener('click', () => {
                                    inputElement.value = item.display_name;
                                    suggestionsElement.classList.add('hidden');
                                    
                                    const lat = parseFloat(item.lat);
                                    const lon = parseFloat(item.lon);

                                    if (type === 'origin') {
                                        document.getElementById('origin-lat').textContent = lat.toFixed(6);
                                        document.getElementById('origin-lon').textContent = lon.toFixed(6);
                                        document.getElementById('btn-copy-origin').classList.remove('hidden');
                                        updateMapMarker('origin', lat, lon, item.display_name);
                                    } else {
                                        document.getElementById('dest-lat').textContent = lat.toFixed(6);
                                        document.getElementById('dest-lon').textContent = lon.toFixed(6);
                                        document.getElementById('btn-copy-dest').classList.remove('hidden');
                                        updateMapMarker('dest', lat, lon, item.display_name);
                                    }
                                });
                                suggestionsElement.appendChild(div);
                            });
                            suggestionsElement.classList.remove('hidden');
                        })
                        .catch(err => console.error("Error buscando direcciones:", err));
                }, 300);
            });

            // Ocultar sugerencias al hacer clic fuera
            document.addEventListener('click', function(e) {
                if (!inputElement.contains(e.target) && !suggestionsElement.contains(e.target)) {
                    suggestionsElement.classList.add('hidden');
                }
            });
        }

        setupAutocomplete(originInput, originSuggestions, 'origin');
        setupAutocomplete(destInput, destSuggestions, 'dest');

        // Actualizar marcador en el mapa
        function updateMapMarker(type, lat, lon, title) {
            if (type === 'origin') {
                if (originMarker) map.removeLayer(originMarker);
                originMarker = L.marker([lat, lon]).addTo(map)
                    .bindPopup(`<b>Origen:</b><br>${title}`).openPopup();
            } else {
                if (destMarker) map.removeLayer(destMarker);
                destMarker = L.marker([lat, lon], {
                    // Icono distintivo o color por defecto de Leaflet
                }).addTo(map).bindPopup(`<b>Destino:</b><br>${title}`).openPopup();
            }
            map.setView([lat, lon], 15);
            document.getElementById('status-msg').textContent = `Ubicación de ${type === 'origin' ? 'Origen' : 'Destino'} actualizada.`;
        }

        // Función para copiar coordenadas de forma rápida
        function copyCoords(type) {
            const lat = document.getElementById(`${type}-lat`).textContent;
            const lon = document.getElementById(`${type}-lon`).textContent;
            const textToCopy = `${lat}, ${lon}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
