<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places (New) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        
        /* Contenedor compacto y adaptado para que no se desborde en móviles */
        gmp-place-autocomplete {
            width: 100% !important;
            max-width: 100% !important;
            display: block;
            box-sizing: border-box;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        gmp-place-autocomplete::part(container) {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        
        gmp-place-autocomplete::part(input) {
            width: 100% !important;
            background-color: #161616 !important;
            border: 1px solid #2e2e2e !important;
            border-radius: 0.6rem !important;
            padding: 0.45rem 0.75rem !important;
            font-size: 0.8rem !important;
            color: #ffffff !important;
            font-family: inherit !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
        }

        gmp-place-autocomplete::part(input):focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
        }

        gmp-place-autocomplete input {
            width: 100% !important;
            background-color: #161616 !important;
            border: 1px solid #2e2e2e !important;
            border-radius: 0.6rem;
            padding: 0.45rem 0.75rem;
            font-size: 0.8rem;
            color: #ffffff !important;
            outline: none;
            box-sizing: border-box;
        }
        gmp-place-autocomplete input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased overflow-x-hidden">

    <div class="max-w-6xl mx-auto px-3 py-4 sm:py-8">
        <header class="mb-4 text-center">
            <h1 class="text-xl sm:text-2xl font-extrabold text-blue-500 tracking-tight">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-400 text-xs mt-1">Selecciona origen y destino para trazar tu ruta automáticamente.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Panel de Controles -->
            <div id="control-panel" class="bg-[#111111] border border-[#222222] p-3.5 sm:p-5 rounded-2xl shadow-2xl space-y-3.5 lg:col-span-1">
                
                <!-- Origen -->
                <div class="space-y-1">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="space-y-1">
                        <label class="block text-[9px] font-bold uppercase text-slate-500">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-origen" placeholder="Dirección limpia..." class="w-full bg-[#161616] border border-[#262626] rounded-lg px-2 py-1 text-[11px] text-slate-300 font-medium" readonly>
                    </div>
                    
                    <div class="p-2 bg-[#161616] rounded-lg border border-[#262626] text-[11px] text-slate-400 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-300">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold text-slate-300">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-400 hover:text-blue-300 font-semibold cursor-pointer px-2 py-0.5 rounded bg-blue-500/10 transition">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div class="space-y-1 pt-2 border-t border-[#222222]">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="space-y-1">
                        <label class="block text-[9px] font-bold uppercase text-slate-500">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-destino" placeholder="Dirección limpia..." class="w-full bg-[#161616] border border-[#262626] rounded-lg px-2 py-1 text-[11px] text-slate-300 font-medium" readonly>
                    </div>
                    
                    <div class="p-2 bg-[#161616] rounded-lg border border-[#262626] text-[11px] text-slate-400 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-300">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold text-slate-300">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-400 hover:text-blue-300 font-semibold cursor-pointer px-2 py-0.5 rounded bg-blue-500/10 transition">Copiar</button>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-[#161616] p-2.5 rounded-xl border border-[#262626] space-y-1 text-xs">
                    <div class="flex justify-between">
                        <span class="text-slate-400">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-200">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-200">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-[#111111] border border-[#222222] p-3 sm:p-4 rounded-2xl shadow-2xl lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-xl overflow-hidden border border-[#262626] mb-3">
                    <div id="map"></div>
                </div>
                <div class="flex flex-wrap gap-3 justify-between items-center text-xs">
                    <div id="status-msg" class="text-slate-400 italic">Selecciona origen y destino para trazar la ruta.</div>
                    <a id="gmaps-link" href="#" target="_blank" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-900/30">
                        Abrir en Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal unificado -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });

                    configurarSesgoBusqueda('origen-autocomplete');
                    configurarSesgoBusqueda('destino-autocomplete');

                    configurarLugar('origen-autocomplete', 'campo-libre-origen', 'origin-lat', 'origin-lon', 'btn-copy-origin', 'origin');
                    configurarLugar('destino-autocomplete', 'campo-libre-destino', 'dest-lat', 'dest-lon', 'btn-copy-dest', 'dest');

                    setupMobileScroll('origen-autocomplete');
                    setupMobileScroll('destino-autocomplete');
                }
            }, 300);
        });

        function setupMobileScroll(autocompleteId) {
            const el = document.getElementById(autocompleteId);
            if (el) {
                el.addEventListener('focusin', () => {
                    setTimeout(() => {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                });
            }
        }

        function configurarSesgoBusqueda(autocompleteId) {
            const autocompleteEl = document.getElementById(autocompleteId);
            if (autocompleteEl) {
                const defaultBounds = {
                    north: 10.8500,
                    south: 10.4500,
                    east: -71.4500,
                    west: -71.8000,
                };
                autocompleteEl.includedBounds = defaultBounds;
                autocompleteEl.locationBias = maracaiboCenter;
            }
        }

        function configurarLugar(autocompleteId, campoLibreId, latId, lonId, btnCopyId, tipo) {
            const autocompleteEl = document.getElementById(autocompleteId);
            const campoLibreEl = document.getElementById(campoLibreId);

            if (autocompleteEl) {
                autocompleteEl.addEventListener('gmp-select', async ({ placePrediction }) => {
                    if (!placePrediction) return;

                    const place = placePrediction.toPlace();
                    await place.fetchFields({ fields: ['formattedAddress', 'displayName', 'location'] });

                    const direccionFinal = place.formattedAddress || place.displayName;
                    const location = place.location;

                    if (direccionFinal && location) {
                        const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                        const lng = typeof location.lng === 'function' ? location.lng() : location.lng;

                        campoLibreEl.value = direccionFinal;
                        document.getElementById(latId).textContent = lat.toFixed(6);
                        document.getElementById(lonId).textContent = lng.toFixed(6);
                        document.getElementById(btnCopyId).classList.remove('hidden');

                        const coords = { lat, lng };
                        if (tipo === 'origin') {
                            origenCoords = coords;
                            updateMarker('origin', coords);
                        } else {
                            destCoords = coords;
                            updateMarker('dest', coords);
                        }

                        verificarYCalcularRuta();
                    }
                });
            }
        }

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }

            if (origenCoords && destCoords) {
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(origenCoords);
                bounds.extend(destCoords);
                map.fitBounds(bounds);
            } else {
                map.setCenter(coord);
                map.setZoom(15);
            }
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta vial con Google...";
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(response);

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";

                        const gmapsLink = document.getElementById('gmaps-link');
                        gmapsLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origenCoords.lat},${origenCoords.lng}&destination=${destCoords.lat},${destCoords.lng}&travelmode=driving`;
                        gmapsLink.classList.remove('hidden');
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta para estos puntos.";
                    }
                });
            }
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lat`).textContent;
            const lon = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
