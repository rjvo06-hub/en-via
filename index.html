<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places (Legacy/Autocomplete Service) y geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        
        /* Input personalizado totalmente flexible y sin rigideces */
        .custom-search-input {
            width: 100%;
            background-color: #161616 !important;
            border: 1px solid #3b82f6 !important;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #ffffff !important;
            outline: none;
        }
        .custom-search-input:focus {
            background-color: #1a1a1a !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        /* Contenedor de sugerencias desplegable personalizado para el modo oscuro */
        .pac-container {
            background-color: #161616 !important;
            border: 1px solid #3b82f6 !important;
            font-family: inherit;
            border-radius: 0.5rem;
            margin-top: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .pac-item {
            color: #cbd5e1 !important;
            border-top: 1px solid #262626 !important;
            padding: 8px 12px;
            cursor: pointer;
        }
        .pac-item:hover, .pac-item-selected {
            background-color: #262626 !important;
        }
        .pac-matched {
            color: #60a5fa !important;
            font-weight: bold;
        }
        .pac-icon {
            filter: invert(1) brightness(1.5);
        }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-500">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-400 mt-1">Selecciona origen y destino para mostrar coordenadas y trazar la ruta automáticamente.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-[#121212] border border-[#222222] p-6 rounded-xl shadow-2xl space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Dirección de Origen</label>
                    <input type="text" id="origen-input" class="custom-search-input" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    
                    <div class="space-y-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-500">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-origen" placeholder="Dirección limpia..." class="w-full bg-[#161616] border border-[#2a2a2a] rounded-lg px-3 py-2 text-xs text-slate-200 font-medium" readonly>
                    </div>
                    
                    <div class="p-2 bg-[#161616] rounded border border-[#2a2a2a] text-xs text-slate-400 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-300">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold text-slate-300">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-400 hover:text-blue-300 font-medium cursor-pointer">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div class="space-y-2 pt-2 border-t border-[#222222]">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Dirección de Destino</label>
                    <input type="text" id="destino-input" class="custom-search-input" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    
                    <div class="space-y-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-500">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-destino" placeholder="Dirección limpia..." class="w-full bg-[#161616] border border-[#2a2a2a] rounded-lg px-3 py-2 text-xs text-slate-200 font-medium" readonly>
                    </div>
                    
                    <div class="p-2 bg-[#161616] rounded border border-[#2a2a2a] text-xs text-slate-400 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-slate-300">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold text-slate-300">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-400 hover:text-blue-300 font-medium cursor-pointer">Copiar</button>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-[#161616] p-4 rounded-xl border border-[#2a2a2a] space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-200">-</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-200">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-[#121212] border border-[#222222] p-4 rounded-xl shadow-2xl lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-[#2a2a2a] mb-4">
                    <div id="map"></div>
                </div>
                <div class="flex flex-wrap gap-3 justify-between items-center text-sm">
                    <div id="status-msg" class="text-slate-400 italic">Selecciona origen y destino para trazar la ruta.</div>
                    <a id="gmaps-link" href="#" target="_blank" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition shadow-sm">
                        Abrir ruta en Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal con Autocomplete clásico -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });

                    // Inicializar autocompletado clásico de Google orientado a Maracaibo
                    initAutocomplete('origen-input', 'campo-libre-origen', 'origin-lat', 'origin-lon', 'btn-copy-origin', 'origin');
                    initAutocomplete('destino-input', 'campo-libre-destino', 'dest-lat', 'dest-lon', 'btn-copy-dest', 'dest');
                }
            }, 300);
        });

        function initAutocomplete(inputId, campoLibreId, latId, lonId, btnCopyId, tipo) {
            const inputEl = document.getElementById(inputId);
            const campoLibreEl = document.getElementById(campoLibreId);

            // Restricción geográfica alrededor de Maracaibo para priorizar búsqueda local
            const defaultBounds = {
                north: 10.8500,
                south: 10.4500,
                east: -71.4500,
                west: -71.8000,
            };

            const options = {
                bounds: defaultBounds,
                strictBounds: false,
                fields: ['formatted_address', 'name', 'geometry']
            };

            const autocomplete = new google.maps.places.Autocomplete(inputEl, options);

            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) return;

                const direccionFinal = place.formatted_address || place.name;
                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();

                // Mostrar en el campo duplicado
                campoLibreEl.value = direccionFinal;

                // Mostrar lat y lon
                document.getElementById(latId).textContent = lat.toFixed(6);
                document.getElementById(lonId).textContent = lng.toFixed(6);
                document.getElementById(btnCopyId).classList.remove('hidden');

                const coords = { lat, lng };
                if (tipo === 'origin') {
                    origenCoords = coords;
                    updateMarker('origin', coords);
                } else {
                    destCoords = coords;
                    updateMarker('dest', coords);
                }

                verificarYCalcularRuta();
            });
        }

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }

            // Si ambos puntos existen, ajustamos el mapa para mostrar ambos en pantalla
            if (origenCoords && destCoords) {
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(origenCoords);
                bounds.extend(destCoords);
                map.fitBounds(bounds);
            } else {
                map.setCenter(coord);
                map.setZoom(15);
            }
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta vial con Google...";
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(response);

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";

                        const gmapsLink = document.getElementById('gmaps-link');
                        gmapsLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origenCoords.lat},${origenCoords.lng}&destination=${destCoords.lat},${destCoords.lng}&travelmode=driving`;
                        gmapsLink.classList.remove('hidden');
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta para estos puntos.";
                    }
                });
            }
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lat`).textContent;
            const lon = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
