<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Coordenadas y Cálculo de Ruta</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">EN-VIA: Selector de Coordenadas y Ruta</h1>
        
        <div class="space-y-4">
            <!-- Input Origen -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Dirección de Origen</label>
                <input type="text" id="origen" value="Galerias Mall, Maracaibo, Venezuela" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Input Destino -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Dirección de Destino</label>
                <input type="text" id="destino" value="Centro Comercial Sambil Maracaibo, Venezuela" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Botón de cálculo -->
            <button onclick="calcularRuta()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                Obtener Coordenadas y Calcular Ruta
            </button>
        </div>

        <!-- Resultados -->
        <div id="resultados" class="mt-6 hidden space-y-3 bg-slate-100 p-4 rounded-lg text-sm text-slate-700">
            <h2 class="font-semibold text-slate-900 border-b pb-1">Resultados:</h2>
            <div id="info-origen"></div>
            <div id="info-destino"></div>
            <div id="info-ruta" class="mt-2 pt-2 border-t font-medium text-blue-800"></div>
        </div>

        <!-- Contenedor opcional para mostrar el mapa visualmente -->
        <div id="map" class="mt-4 w-full h-64 rounded-lg hidden"></div>
    </div>

    <!-- Carga la API de Google Maps (Reemplaza TU_API_KEY con tu clave real) -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&libraries=places"></script>

    <script>
        function calcularRuta() {
            const origenTexto = document.getElementById('origen').value;
            const destinoTexto = document.getElementById('destino').value;
            
            if (!origenTexto || !destinoTexto) {
                alert('Por favor completa ambas direcciones.');
                return;
            }

            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.classList.remove('hidden');

            const infoOrigen = document.getElementById('info-origen');
            const infoDestino = document.getElementById('info-destino');
            const infoRuta = document.getElementById('info-ruta');

            const geocoder = new google.maps.Geocoder();

            // 1. Geocodificar Origen
            geocoder.geocode({ address: origenTexto }, (resultsOrigen, statusOrigen) => {
                if (statusOrigen === 'OK' && resultsOrigen[0]) {
                    const latO = resultsOrigen[0].geometry.location.lat();
                    const lngO = resultsOrigen[0].geometry.location.lng();
                    infoOrigen.innerHTML = `<strong>[Origen]</strong><br>Lat: ${latO}, Lng: ${lngO}`;
                } else {
                    infoOrigen.innerHTML = `<strong>[Origen]</strong> No se pudo encontrar.`;
                }
            });

            // 2. Geocodificar Destino
            geocoder.geocode({ address: destinoTexto }, (resultsDestino, statusDestino) => {
                if (statusDestino === 'OK' && resultsDestino[0]) {
                    const latD = resultsDestino[0].geometry.location.lat();
                    const lngD = resultsDestino[0].geometry.location.lng();
                    infoDestino.innerHTML = `<strong>[Destino]</strong><br>Lat: ${latD}, Lng: ${lngD}`;
                } else {
                    infoDestino.innerHTML = `<strong>[Destino]</strong> No se pudo encontrar.`;
                }
            });

            // 3. Calcular la Distancia y Ruta usando DirectionsService
            const directionsService = new google.maps.DirectionsService();

            directionsService.route(
                {
                    origin: origenTexto,
                    destination: destinoTexto,
                    travelMode: google.maps.TravelMode.DRIVING // Puedes cambiar a WALKING, TRANSIT, etc.
                },
                (response, status) => {
                    if (status === 'OK') {
                        const route = response.routes[0].legs[0];
                        infoRuta.innerHTML = `🚗 <strong>Distancia:</strong> ${route.distance.text} <br>⏱️ <strong>Tiempo estimado:</strong> ${route.duration.text}`;
                    } else {
                        infoRuta.innerHTML = `⚠️ No se pudo calcular la ruta entre los puntos (${status}).`;
                    }
                }
            );
        }
    </script>
</body>
</html>
