<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel Principal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con la nueva Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- Cabecera simple -->
        <header class="mb-6 flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl shadow-sm">
            <h1 class="text-lg font-bold">🚕 EN-VIA - Solicitud</h1>
            <a href="geo-extractor.html" target="_blank" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">
                🔍 Ir a Extractor
            </a>
        </header>

        <!-- Formulario Principal -->
        <section class="bg-white rounded-2xl shadow-sm p-5 border border-slate-200 space-y-4">
            
            <!-- Origen -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Punto de Origen</label>
                <gmp-place-autocomplete id="origen-autocomplete" class="block w-full">
                    <input type="text" id="origen" placeholder="Ej. Centro Comercial Sambil..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </gmp-place-autocomplete>
                
                <!-- Resultado que regresa del extractor -->
                <div id="resultado-origen" class="mt-2 p-3 bg-blue-50 rounded-xl border border-blue-100 hidden">
                    <p class="text-xs text-slate-500 font-semibold">Lugar seleccionado:</p>
                    <p id="txt-nombre-lugar" class="text-sm font-bold text-slate-800"></p>
                    <div class="mt-1 flex gap-4 text-xs font-mono text-slate-600">
                        <span>Lat: <strong id="txt-lat">0.00</strong></span>
                        <span>Lon: <strong id="txt-lon">0.00</strong></span>
                    </div>
                </div>
            </div>

            <!-- Destino -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Punto de Destino</label>
                <gmp-place-autocomplete id="destino-autocomplete" class="block w-full">
                    <input type="text" id="destino" placeholder="Ej. Vereda del Lago..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </gmp-place-autocomplete>
            </div>

        </section>
    </div>

    <!-- Script de comunicación y enlace con el Extractor -->
    <script>
        window.addEventListener('load', () => {
            // Revisar si hay coordenadas guardadas que acaban de regresar del extractor
            const datosGuardados = localStorage.getItem('en_via_ultima_coordenada');
            if (datosGuardados) {
                const data = JSON.parse(datosGuardados);
                if (data && data.direccion) {
                    document.getElementById('origen').value = data.direccion;
                    document.getElementById('txt-nombre-lugar').textContent = data.direccion;
                    document.getElementById('txt-lat').textContent = data.lat;
                    document.getElementById('txt-lon').textContent = data.lng;
                    document.getElementById('resultado-origen').classList.remove('hidden');
                }
            }

            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    const origenAutocomplete = document.getElementById('origen-autocomplete');

                    if (origenAutocomplete) {
                        // Cuando el usuario hace clic encima de una opción del buscador
                        origenAutocomplete.addEventListener('gmp-placeselect', async (event) => {
                            const place = event.detail.place;
                            if (place) {
                                await place.fetchFields({ fields: ['displayName', 'formattedAddress'] });
                                const nombreLugar = place.displayName || place.formattedAddress || document.getElementById('origen').value;
                                
                                // Empaquetar el dato y mandarlo automáticamente al archivo geo-extractor.html de forma interna
                                localStorage.setItem('en_via_objetivo', nombreLugar);

                                // Simula el viaje rápido al extractor y regreso mostrando el nombre y debajo las coordenadas
                                window.location.href = 'geo-extractor.html?auto=true';
                            }
                        });
                    }
                }
            }, 300);
        });
    </script>
</body>
</html>
