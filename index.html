<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places (New) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        
        /* Estilos optimizados para que el componente nativo de Google encaje perfectamente con el tema oscuro */
        gmp-place-autocomplete { 
            width: 100%;
            display: block;
            border-radius: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease-in-out;
        }

        gmp-place-autocomplete:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        gmp-place-autocomplete input {
            width: 100% !important;
            background-color: #0f172a !important;
            border: none !important;
            color: #f8fafc !important;
            padding: 0.85rem 1rem !important;
            font-size: 0.95rem !important;
            outline: none !important;
            box-sizing: border-box !important;
        }

        gmp-place-autocomplete input::placeholder {
            color: #64748b !important;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-sky-400 tracking-wide">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-400 mt-2 text-sm sm:text-base">Selecciona origen y destino para mostrar coordenadas y trazar la ruta automáticamente.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700/60 space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-sky-400">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="space-y-1 pt-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-origen" placeholder="Dirección limpia..." class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 font-medium" readonly>
                    </div>
                    
                    <div class="p-2.5 bg-slate-900/50 rounded-lg border border-slate-700/50 text-xs text-slate-300 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-sky-400">Lat:</span> <span id="origin-lat">-</span> | 
                            <span class="font-bold text-sky-400">Lon:</span> <span id="origin-lon">-</span>
                        </div>
                        <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-sky-400 hover:text-sky-300 font-semibold cursor-pointer transition">Copiar</button>
                    </div>
                </div>

                <!-- Destino -->
                <div class="space-y-2 pt-2 border-t border-slate-700/60">
                    <label class="block text-xs font-bold uppercase tracking-wider text-sky-400">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <div class="space-y-1 pt-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400">Texto seleccionado:</label>
                        <input type="text" id="campo-libre-destino" placeholder="Dirección limpia..." class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 font-medium" readonly>
                    </div>
                    
                    <div class="p-2.5 bg-slate-900/50 rounded-lg border border-slate-700/50 text-xs text-slate-300 flex justify-between items-center">
                        <div>
                            <span class="font-bold text-sky-400">Lat:</span> <span id="dest-lat">-</span> | 
                            <span class="font-bold text-sky-400">Lon:</span> <span id="dest-lon">-</span>
                        </div>
                        <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-sky-400 hover:text-sky-300 font-semibold cursor-pointer transition">Copiar</button>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-sky-950/40 p-4 rounded-xl border border-sky-800/50 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-300">Distancia:</span>
                        <span id="route-distance" class="font-bold text-sky-300">-</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-300">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-sky-300">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-slate-800 p-4 rounded-2xl shadow-xl border border-slate-700/60 lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-xl overflow-hidden border border-slate-700 mb-4">
                    <div id="map"></div>
                </div>
                <div class="flex flex-wrap gap-3 justify-between items-center text-sm px-2">
                    <div id="status-msg" class="text-slate-400 italic">Selecciona origen y destino para trazar la ruta.</div>
                    <a id="gmaps-link" href="#" target="_blank" class="hidden px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-900/30">
                        Abrir ruta en Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal unificado con la lógica original intacta -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false,
                        styles: [
                            { elementType: "geometry", stylers: [{ color: "#1d232a" }] },
                            { elementType: "labels.text.stroke", stylers: [{ color: "#1a202c" }] },
                            { elementType: "labels.text.fill", stylers: [{ color: "#a0aec0" }] },
                            {
                                featureType: "administrative.locality",
                                elementType: "labels.text.fill",
                                stylers: [{ color: "#cbd5e0" }]
                            },
                            {
                                featureType: "poi",
                                elementType: "labels.text.fill",
                                stylers: [{ color: "#a0aec0" }]
                            },
                            {
                                featureType: "poi.park",
                                elementType: "geometry",
                                stylers: [{ color: "#263238" }]
                            },
                            {
                                featureType: "road",
                                elementType: "geometry",
                                stylers: [{ color: "#2d3748" }]
                            },
                            {
                                featureType: "road",
                                elementType: "geometry.stroke",
                                stylers: [{ color: "#1a202c" }]
                            },
                            {
                                featureType: "road",
                                elementType: "labels.text.fill",
                                stylers: [{ color: "#cbd5e0" }]
                            },
                            {
                                featureType: "transit",
                                elementType: "geometry",
                                stylers: [{ color: "#2d3748" }]
                            },
                            {
                                featureType: "water",
                                elementType: "geometry",
                                stylers: [{ color: "#0f172a" }]
                            },
                            {
                                featureType: "water",
                                elementType: "labels.text.fill",
                                stylers: [{ color: "#4a5568" }]
                            }
                        ]
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ 
                        map: map, 
                        suppressMarkers: false,
                        polylineOptions: {
                            strokeColor: "#38bdf8",
                            strokeWeight: 5,
                            strokeOpacity: 0.8
                        }
                    });

                    // Configurar escucha para origen y destino
                    configurarLugar('origen-autocomplete', 'campo-libre-origen', 'origin-lat', 'origin-lon', 'btn-copy-origin', 'origin');
                    configurarLugar('destino-autocomplete', 'campo-libre-destino', 'dest-lat', 'dest-lon', 'btn-copy-dest', 'dest');
                }
            }, 300);
        });

        function configurarLugar(autocompleteId, campoLibreId, latId, lonId, btnCopyId, tipo) {
            const autocompleteEl = document.getElementById(autocompleteId);
            const campoLibreEl = document.getElementById(campoLibreId);

            if (autocompleteEl) {
                autocompleteEl.addEventListener('gmp-select', async ({ placePrediction }) => {
                    if (!placePrediction) return;

                    const place = placePrediction.toPlace();
                    await place.fetchFields({ fields: ['formattedAddress', 'displayName', 'location'] });

                    const direccionFinal = place.formattedAddress || place.displayName;
                    const location = place.location;

                    if (direccionFinal && location) {
                        const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                        const lng = typeof location.lng === 'function' ? location.lng() : location.lng;

                        // Mostrar en el campo duplicado
                        campoLibreEl.value = direccionFinal;

                        // Mostrar lat y lon
                        document.getElementById(latId).textContent = lat.toFixed(6);
                        document.getElementById(lonId).textContent = lng.toFixed(6);
                        document.getElementById(btnCopyId).classList.remove('hidden');

                        const coords = { lat, lng };
                        if (tipo === 'origin') {
                            origenCoords = coords;
                            updateMarker('origin', coords);
                        } else {
                            destCoords = coords;
                            updateMarker('dest', coords);
                        }

                        verificarYCalcularRuta();
                    }
                });
            }
        }

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }
            map.setCenter(coord);
            map.setZoom(15);
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta vial con Google...";
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        if (originMarker) originMarker.setMap(null);
                        if (destMarker) destMarker.setMap(null);
                        directionsRenderer.setDirections(response);

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";

                        const gmapsLink = document.getElementById('gmaps-link');
                        gmapsLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origenCoords.lat},${origenCoords.lng}&destination=${destCoords.lat},${destCoords.lng}&travelmode=driving`;
                        gmapsLink.classList.remove('hidden');
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta para estos puntos.";
                    }
                });
            }
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lat`).textContent;
            const lon = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
