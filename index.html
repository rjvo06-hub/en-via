<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Rutas y Coordenadas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        gmp-place-autocomplete { width: 100%; }
        gmp-place-autocomplete input {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #1e293b;
            outline: none;
        }
        gmp-place-autocomplete input:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Cabecera simple con acceso al extractor -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold text-blue-600">EN-VIA</h1>
                <p class="text-xs text-slate-500">Rutas y Coordenadas con Google Maps</p>
            </div>
            <a href="geo-extractor.html" target="_blank" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-2 rounded-xl transition shadow-sm">
                🔍 Ir al Extractor de Coordenadas
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles Minimalista -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Origen</label>
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" id="origen" placeholder="Ej. Sambil Maracaibo..." autocomplete="off">
                    </gmp-place-autocomplete>
                    <div class="mt-2 text-xs text-slate-600">
                        <span class="font-bold">Lat/Lon:</span> <span id="origin-coords" class="font-mono">-</span>
                    </div>
                </div>

                <!-- Destino -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Dirección de Destino</label>
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" id="destino" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    <div class="mt-2 text-xs text-slate-600">
                        <span class="font-bold">Lat/Lon:</span> <span id="dest-coords" class="font-mono">-</span>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-slate-600">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-600">Tiempo:</span>
                        <span id="route-duration" class="font-bold text-slate-800">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-xl overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div id="status-msg" class="text-xs text-slate-500 text-center italic">
                    Selecciona origen y destino para trazar la ruta en el mapa.
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integración Limpia -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destinoCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });

                    const origenAutocomplete = document.getElementById('origen-autocomplete');
                    const destinoAutocomplete = document.getElementById('destino-autocomplete');

                    async function procesarLugar(placeObj, tipo) {
                        if (!placeObj) return;
                        if (typeof placeObj.fetchFields === 'function') {
                            await placeObj.fetchFields({ fields: ['location'] });
                        }
                        const location = placeObj.location || (placeObj.geometry && placeObj.geometry.location);
                        if (location) {
                            const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                            const lng = typeof location.lng === 'function' ? location.lng() : location.lng;
                            const coords = { lat, lng };

                            if (tipo === 'origen') {
                                origenCoords = coords;
                                document.getElementById('origin-coords').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                                updateMarker('origen', coords);
                            } else {
                                destinoCoords = coords;
                                document.getElementById('dest-coords').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                                updateMarker('destino', coords);
                            }
                            intentarCalcularRuta();
                        }
                    }

                    if (origenAutocomplete) {
                        origenAutocomplete.addEventListener('gmp-placeselect', async (e) => procesarLugar(e.detail.place, 'origen'));
                    }
                    if (destinoAutocomplete) {
                        destinoAutocomplete.addEventListener('gmp-placeselect', async (e) => procesarLugar(e.detail.place, 'destino'));
                    }
                }
            }, 300);
        });

        function updateMarker(tipo, coord) {
            if (tipo === 'origen') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }
            map.setCenter(coord);
            map.setZoom(15);
        }

        function intentarCalcularRuta() {
            if (!origenCoords || !destinoCoords) return;

            document.getElementById('status-msg').textContent = "Calculando ruta vial...";
            const request = {
                origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                destination: new google.maps.LatLng(destinoCoords.lat, destinoCoords.lng),
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, (response, status) => {
                if (status === 'OK') {
                    if (originMarker) originMarker.setMap(null);
                    if (destMarker) destMarker.setMap(null);
                    directionsRenderer.setDirections(response);

                    const route = response.routes[0].legs[0];
                    document.getElementById('route-distance').textContent = route.distance.text;
                    document.getElementById('route-duration').textContent = route.duration.text;
                    document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";
                } else {
                    document.getElementById('status-msg').textContent = "No se pudo calcular la ruta.";
                }
            });
        }
    </script>
</body>
</html>
