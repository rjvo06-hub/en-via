<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Panel de Carreras y Coordenadas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Google Maps API con librerías de places y geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4uaDGEnYaYHBqxhcCGyKA2uTAyJmwRZQ&libraries=places,geometry" async defer></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Cabecera Adaptativa con Acceso al Gestor de Conductores -->
    <header class="bg-slate-900 text-white shadow-sm sticky top-0 z-50 py-3 px-4">
        <div class="app-container flex justify-between items-center !p-0">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                <span>🚕</span> EN-VIA
            </h1>
            <div class="flex items-center gap-2">
                <!-- Enlace directo al capturador de conductores en la carpeta admin/ -->
                <a href="admin/conductores.html" class="text-xs bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1.5 font-medium">
                    <span>👥</span> Conductores
                </a>
                <div class="flex items-center gap-1.5 pl-2 border-l border-slate-800">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs font-medium text-slate-300">En Vivo</span>
                </div>
            </div>
        </div>
    </header>

    <main class="app-container pb-16 pt-4 max-w-xl mx-auto px-4">
        
        <!-- Formulario para Registrar/Publicar Solicitud -->
        <section class="bg-white rounded-2xl shadow-sm p-5 mb-6 border border-slate-200">
            <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center justify-between">
                <span>Nueva Solicitud y Coordenadas</span>
                <span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-md font-medium">Panel Operativo</span>
            </h2>
            
            <form id="formCarrera" class="space-y-3.5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Cliente</label>
                        <input type="text" id="clienteNombre" placeholder="Nombre" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Teléfono</label>
                        <input type="tel" id="clienteTelefono" placeholder="Móvil" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                </div>

                <!-- Punto de Origen con Autocompletado Clásico -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Punto de Origen</label>
                    <input type="text" id="origen" required placeholder="Ej. Galerías Mall, Maracaibo..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <!-- Destino con Autocompletado Clásico -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Destino</label>
                    <input type="text" id="destino" required placeholder="Ej. Centro Comercial Sambil, Maracaibo..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Hora</label>
                        <input type="text" id="hora" required placeholder="Ej. 14:30" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Distancia (Automática)</label>
                        <!-- Campo bloqueado -->
                        <input type="text" id="distancia" readonly placeholder="Pendiente..." class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-slate-600 font-medium cursor-not-allowed">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Precio Acordado ($ - Automático)</label>
                    <!-- Campo bloqueado -->
                    <input type="text" id="precio" readonly placeholder="Pendiente..." class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-emerald-700 font-bold cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Notas / Observaciones</label>
                    <input type="text" id="notas" placeholder="Ej. Equipaje grande, vuelo..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-sm mt-2">
                    Publicar Servicio
                </button>
            </form>
        </section>

        <!-- Listado de Servicios Disponibles -->
        <section>
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-base font-bold text-slate-900">Servicios Disponibles</h2>
                <span id="contadorCarreras" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full">0</span>
            </div>
            
            <div id="listaCarreras" class="space-y-3">
                <p class="text-slate-400 text-center py-10 bg-white rounded-2xl border border-slate-200 text-sm">Cargando servicios...</p>
            </div>
        </section>

    </main>

    <!-- Supabase JS UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/app.js"></script>

    <!-- Script de Autocompletado Clásico y Cálculo Preciso de Distancia -->
    <script>
        window.gm_authFailure = function() {
            console.error("⚠️ Error de autenticación en Google Maps.");
        };

        let origenCoords = null;
        let destinoCoords = null;
        let directionsService;

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    directionsService = new google.maps.DirectionsService();

                    // Delimitador geográfico para Maracaibo, Zulia
                    const maracaiboBounds = new google.maps.LatLngBounds(
                        new google.maps.LatLng(10.5800, -71.7200), // Suroeste
                        new google.maps.LatLng(10.7500, -71.5500)  // Noreste
                    );

                    const options = {
                        bounds: maracaiboBounds,
                        componentRestrictions: { country: 've' },
                        fields: ['geometry', 'formatted_address', 'name']
                    };

                    // 1. Inicializar Autocompletado Clásico en el input de Origen
                    const inputOrigen = document.getElementById('origen');
                    const autocompleteOrigen = new google.maps.places.Autocomplete(inputOrigen, options);

                    autocompleteOrigen.addListener('place_changed', () => {
                        const place = autocompleteOrigen.getPlace();
                        if (place.geometry && place.geometry.location) {
                            origenCoords = {
                                lat: place.geometry.location.lat(),
                                lng: place.geometry.location.lng()
                            };
                            console.log("📍 Origen Lat/Lng capturado:", origenCoords);
                            intentarCalcularDistancia();
                        } else {
                            console.warn("⚠️ No se obtuvieron coordenadas para el origen.");
                        }
                    });

                    // 2. Inicializar Autocompletado Clásico en el input de Destino
                    const inputDestino = document.getElementById('destino');
                    const autocompleteDestino = new google.maps.places.Autocomplete(inputDestino, options);

                    autocompleteDestino.addListener('place_changed', () => {
                        const place = autocompleteDestino.getPlace();
                        if (place.geometry && place.geometry.location) {
                            destinoCoords = {
                                lat: place.geometry.location.lat(),
                                lng: place.geometry.location.lng()
                            };
                            console.log("📍 Destino Lat/Lng capturado:", destinoCoords);
                            intentarCalcularDistancia();
                        } else {
                            console.warn("⚠️ No se obtuvieron coordenadas para el destino.");
                        }
                    });

                    // Hora actual por defecto
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const inputHora = document.getElementById('hora');
                    if (inputHora) inputHora.value = `${hours}:${minutes}`;

                    console.log("✅ Autocompletado clásico de Google Maps configurado con éxito.");
                }
            }, 300);

            setTimeout(() => {
                clearInterval(checkMapsInterval);
            }, 8000);
        });

        // 3. Función que toma ambas coordenadas y calcula la distancia por carretera
        function intentarCalcularDistancia() {
            if (!origenCoords || !destinoCoords) {
                console.log("⏳ Esperando ambas coordenadas. Origen:", origenCoords ? "OK" : "Falta", "| Destino:", destinoCoords ? "OK" : "Falta");
                return;
            }

            document.getElementById('distancia').value = "Calculando...";
            document.getElementById('precio').value = "Calculando...";

            const origenLatLng = new google.maps.LatLng(origenCoords.lat, origenCoords.lng);
            const destinoLatLng = new google.maps.LatLng(destinoCoords.lat, destinoCoords.lng);

            console.log("🚀 Solicitando ruta al DirectionsService con coordenadas exactas...");

            directionsService.route(
                {
                    origin: origenLatLng,
                    destination: destinoLatLng,
                    travelMode: google.maps.TravelMode.DRIVING
                },
                (response, status) => {
                    if (status === 'OK') {
                        const route = response.routes[0].legs[0];
                        
                        const distanciaMetros = route.distance.value;
                        const kmValor = distanciaMetros / 1000;
                        
                        // Rellenar campo distancia bloqueado
                        document.getElementById('distancia').value = `${kmValor.toFixed(2)} km`;

                        // Regla de cobro: $1 por kilómetro, mínimo $3
                        let precioCalculado = kmValor * 1.0; 
                        if (precioCalculado < 3) {
                            precioCalculado = 3.00;
                        }

                        // Rellenar campo precio bloqueado
                        document.getElementById('precio').value = `${precioCalculado.toFixed(2)}`;
                        console.log(`✅ ¡Cálculo exitoso! Distancia: ${kmValor.toFixed(2)} km | Precio: $${precioCalculado.toFixed(2)}`);
                    } else {
                        console.error("❌ Error en DirectionsService:", status);
                        document.getElementById('distancia').value = "Error al calcular";
                        document.getElementById('precio').value = "Error";
                    }
                }
            );
        }
    </script>
</body>
</html>
