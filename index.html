<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Prevenir zoom automático en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places y geometry -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 400px; width: 100%; }

        input {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input {
                font-size: 0.85rem !important;
            }
        }

        /* Lista de sugerencias flotante limpia y adaptada */
        .custom-suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: #141414;
            border: 1px solid #2e2e2e;
            border-radius: 0.75rem;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.9);
        }
        .suggestion-item {
            padding: 10px 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
            border-bottom: 1px solid #1f1f1f;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background-color: #1f1f1f;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-black min-h-screen text-slate-100 antialiased overflow-x-hidden">

    <div class="max-w-4xl mx-auto px-3 py-4 sm:py-8">
        <header class="mb-4 text-center">
            <h1 class="text-xl sm:text-2xl font-extrabold text-blue-500 tracking-tight">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-400 text-xs mt-1">Busca y selecciona tu origen y destino paso a paso.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Panel de Controles Unificado -->
            <div class="bg-[#111111] border border-[#222222] p-4 rounded-2xl shadow-2xl space-y-4 flex flex-col justify-between">
                
                <div class="space-y-4">
                    <!-- Selector de Modo (Origen / Destino) -->
                    <div class="flex bg-[#161616] p-1 rounded-xl border border-[#262626]">
                        <button id="btn-mode-origin" onclick="setMode('origin')" class="flex-1 py-2 text-xs font-bold uppercase rounded-lg transition bg-blue-600 text-white shadow-sm cursor-pointer">
                            1. Buscar Origen
                        </button>
                        <button id="btn-mode-dest" onclick="setMode('dest')" class="flex-1 py-2 text-xs font-bold uppercase rounded-lg transition text-slate-400 hover:text-white cursor-pointer">
                            2. Buscar Destino
                        </button>
                    </div>

                    <!-- Buscador Único Dinámico -->
                    <div class="space-y-1 relative">
                        <label id="search-label" class="block text-[10px] font-bold uppercase tracking-wider text-blue-400">Escribiendo Dirección de Origen...</label>
                        <div class="relative">
                            <input type="text" id="unified-input" placeholder="Ej. Centro Comercial Sambil..." class="w-full bg-[#161616] border border-[#3b82f6] focus:border-blue-400 rounded-xl px-3 py-2.5 text-white outline-none transition" autocomplete="off">
                            <div id="unified-suggestions" class="custom-suggestions-list hidden"></div>
                        </div>
                    </div>

                    <!-- Tarjetas de Resumen (Origen y Destino ya seleccionados) -->
                    <div class="space-y-2 pt-2 border-t border-[#222222]">
                        <!-- Origen Registrado -->
                        <div class="p-2.5 bg-[#161616] rounded-xl border border-[#262626] space-y-1">
                            <div class="flex justify-between items-center text-[10px] font-bold uppercase text-slate-400">
                                <span>📍 Origen:</span>
                                <span id="origin-status" class="text-amber-500 font-medium">Pendiente</span>
                            </div>
                            <input type="text" id="campo-libre-origen" placeholder="Sin seleccionar..." class="w-full bg-transparent text-xs text-slate-200 font-medium outline-none truncate" readonly>
                            <div class="flex justify-between items-center text-[11px] text-slate-400 pt-1 border-t border-[#222222]">
                                <div><span class="font-bold text-slate-300">Lat:</span> <span id="origin-lat">-</span> | <span class="font-bold text-slate-300">Lon:</span> <span id="origin-lon">-</span></div>
                                <button onclick="copyCoords('origin')" id="btn-copy-origin" class="hidden text-blue-400 hover:text-blue-300 font-semibold cursor-pointer px-2 py-0.5 rounded bg-blue-500/10 transition">Copiar</button>
                            </div>
                        </div>

                        <!-- Destino Registrado -->
                        <div class="p-2.5 bg-[#161616] rounded-xl border border-[#262626] space-y-1">
                            <div class="flex justify-between items-center text-[10px] font-bold uppercase text-slate-400">
                                <span>🏁 Destino:</span>
                                <span id="dest-status" class="text-amber-500 font-medium">Pendiente</span>
                            </div>
                            <input type="text" id="campo-libre-destino" placeholder="Sin seleccionar..." class="w-full bg-transparent text-xs text-slate-200 font-medium outline-none truncate" readonly>
                            <div class="flex justify-between items-center text-[11px] text-slate-400 pt-1 border-t border-[#222222]">
                                <div><span class="font-bold text-slate-300">Lat:</span> <span id="dest-lat">-</span> | <span class="font-bold text-slate-300">Lon:</span> <span id="dest-lon">-</span></div>
                                <button onclick="copyCoords('dest')" id="btn-copy-dest" class="hidden text-blue-400 hover:text-blue-300 font-semibold cursor-pointer px-2 py-0.5 rounded bg-blue-500/10 transition">Copiar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumen de Ruta por Carretera y Botón Google Maps -->
                <div class="bg-[#161616] p-3 rounded-xl border border-[#262626] space-y-2 mt-3">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Distancia por carretera:</span>
                        <span id="route-distance" class="font-bold text-emerald-400">-</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-200">-</span>
                    </div>
                    <div id="status-msg" class="text-slate-400 italic text-[11px] pt-1 border-t border-[#222222]">Selecciona origen y destino.</div>
                    <a id="gmaps-link" href="#" target="_blank" class="hidden w-full text-center block px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition shadow-lg shadow-emerald-900/30 text-xs">
                        Abrir ruta en Google Maps
                    </a>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-[#111111] border border-[#222222] p-3 rounded-2xl shadow-2xl flex flex-col justify-between">
                <div class="rounded-xl overflow-hidden border border-[#262626] h-full">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal con router (Routes API) y prioridad a displayName -->
    <script>
        let map;
        let router;
        let directionsRenderer;
        let autocompleteService;
        let placesService;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;
        
        let currentMode = 'origin';
        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };
        const apiKey = "AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I";

        window.addEventListener('load', () => {
            const checkMapsInterval = setInterval(async () => {
                if (typeof google !== 'undefined' && google.maps && google.maps.places) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    router = {
                        route: async (request, callback) => {
                            try {
                                const body = {
                                    origin: {
                                        location: { latLng: { latitude: request.origin.lat(), longitude: request.origin.lng() } }
                                    },
                                    destination: {
                                        location: { latLng: { latitude: request.destination.lat(), longitude: request.destination.lng() } }
                                    },
                                    travelMode: "DRIVE",
                                    routingPreference: "TRAFFIC_UNAWARE"
                                };

                                const response = await fetch(`https://routes.googleapis.com/directions/v2:computeRoutes`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'X-Goog-Api-Key': apiKey,
                                        'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline'
                                    },
                                    body: JSON.stringify(body)
                                });

                                const data = await response.json();

                                if (data.routes && data.routes.length > 0) {
                                    const route = data.routes[0];
                                    
                                    const distanceKm = (route.distanceMeters / 1000).toFixed(1) + " km";
                                    const durationSec = parseInt(route.duration);
                                    const durationMins = Math.round(durationSec / 60);
                                    const durationText = durationMins > 60 ? `${Math.floor(durationMins/60)} h ${durationMins%60} min` : `${durationMins} mins`;

                                    const decodedPath = google.maps.geometry.encoding.decodePath(route.polyline.encodedPolyline);
                                    
                                    if (window.currentRoutePolyline) {
                                        window.currentRoutePolyline.setMap(null);
                                    }
                                    window.currentRoutePolyline = new google.maps.Polyline({
                                        path: decodedPath,
                                        geodesic: true,
                                        strokeColor: '#3b82f6',
                                        strokeOpacity: 0.8,
                                        strokeWeight: 5
                                    });
                                    window.currentRoutePolyline.setMap(map);

                                    callback({
                                        routes: [{
                                            legs: [{
                                                distance: { text: distanceKm },
                                                duration: { text: durationText }
                                            }]
                                        }]
                                    }, 'OK');
                                } else {
                                    callback(null, 'ZERO_RESULTS');
                                }
                            } catch (error) {
                                console.error("Error en Routes API:", error);
                                callback(null, 'ERROR');
                            }
                        }
                    };

                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true });
                    autocompleteService = new google.maps.places.AutocompleteService();
                    placesService = new google.maps.places.PlacesService(map);

                    setupUnifiedAutocomplete();
                }
            }, 300);
        });

        function setMode(mode) {
            currentMode = mode;
            const btnOrigin = document.getElementById('btn-mode-origin');
            const btnDest = document.getElementById('btn-mode-dest');
            const searchLabel = document.getElementById('search-label');
            const input = document.getElementById('unified-input');

            input.value = '';
            document.getElementById('unified-suggestions').classList.add('hidden');

            if (mode === 'origin') {
                btnOrigin.className = "flex-1 py-2 text-xs font-bold uppercase rounded-lg transition bg-blue-600 text-white shadow-sm cursor-pointer";
                btnDest.className = "flex-1 py-2 text-xs font-bold uppercase rounded-lg transition text-slate-400 hover:text-white cursor-pointer";
                searchLabel.textContent = "Escribiendo Dirección de Origen...";
                searchLabel.className = "block text-[10px] font-bold uppercase tracking-wider text-blue-400";
                input.placeholder = "Ej. Centro Comercial Sambil...";
            } else {
                btnDest.className = "flex-1 py-2 text-xs font-bold uppercase rounded-lg transition bg-blue-600 text-white shadow-sm cursor-pointer";
                btnOrigin.className = "flex-1 py-2 text-xs font-bold uppercase rounded-lg transition text-slate-400 hover:text-white cursor-pointer";
                searchLabel.textContent = "Escribiendo Dirección de Destino...";
                searchLabel.className = "block text-[10px] font-bold uppercase tracking-wider text-emerald-400";
                input.placeholder = "Ej. Vereda del Lago...";
            }
            input.focus();
        }

        // Limpiar Plus Codes por seguridad si llegaran a filtrarse
        function limpiarDireccion(texto) {
            if (!texto) return '';
            return texto.replace(/^[A-Z0-9]{4}\+[A-Z0-9]{2,3},\s*/i, '');
        }

        function setupUnifiedAutocomplete() {
            const input = document.getElementById('unified-input');
            const suggestionsBox = document.getElementById('unified-suggestions');

            let debounceTimer;

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const query = input.value.trim();

                if (query.length < 2) {
                    suggestionsBox.classList.add('hidden');
                    suggestionsBox.innerHTML = '';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    try {
                        const request = {
                            input: query,
                            includedRegionCodes: ['VE'],
                            locationBias: { center: maracaiboCenter, radius: 25000 }
                        };

                        const { suggestions } = await google.maps.places.AutocompleteSuggestion.fetchAutocompleteSuggestions(request);

                        if (suggestions && suggestions.length > 0) {
                            suggestionsBox.innerHTML = '';
                            suggestionsBox.classList.remove('hidden');

                            suggestions.forEach(suggestion => {
                                const placePrediction = suggestion.placePrediction;
                                if (!placePrediction) return;

                                const div = document.createElement('div');
                                div.className = 'suggestion-item';
                                div.textContent = placePrediction.text.toString();
                                
                                div.addEventListener('click', async () => {
                                    input.value = '';
                                    suggestionsBox.classList.add('hidden');
                                    suggestionsBox.innerHTML = '';

                                    const place = placePrediction.toPlace();
                                    await place.fetchFields({ fields: ['formattedAddress', 'displayName', 'location'] });

                                    const location = place.location;
                                    if (location) {
                                        const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
                                        const lng = typeof location.lng === 'function' ? location.lng() : location.lng;
                                        
                                        // Priorizar displayName (nombre del local o sitio) si existe, sino usar formattedAddress o el texto de predicción
                                        let nombreLugar = place.displayName || place.formattedAddress || placePrediction.text.toString();
                                        const direccionFinal = limpiarDireccion(nombreLugar);
                                        const coords = { lat, lng };

                                        if (currentMode === 'origin') {
                                            origenCoords = coords;
                                            document.getElementById('campo-libre-origen').value = direccionFinal;
                                            document.getElementById('origin-lat').textContent = lat.toFixed(6);
                                            document.getElementById('origin-lon').textContent = lng.toFixed(6);
                                            document.getElementById('btn-copy-origin').classList.remove('hidden');
                                            document.getElementById('origin-status').textContent = "Listo";
                                            document.getElementById('origin-status').className = "text-emerald-500 font-bold";
                                            updateMarker('origin', coords);

                                            setMode('dest');
                                        } else {
                                            destCoords = coords;
                                            document.getElementById('campo-libre-destino').value = direccionFinal;
                                            document.getElementById('dest-lat').textContent = lat.toFixed(6);
                                            document.getElementById('dest-lon').textContent = lng.toFixed(6);
                                            document.getElementById('btn-copy-dest').classList.remove('hidden');
                                            document.getElementById('dest-status').textContent = "Listo";
                                            document.getElementById('dest-status').className = "text-emerald-500 font-bold";
                                            updateMarker('dest', coords);
                                        }

                                        verificarYCalcularRuta();
                                    }
                                });

                                suggestionsBox.appendChild(div);
                            });
                        } else {
                            suggestionsBox.classList.add('hidden');
                        }
                    } catch (error) {
                        console.error("Error al obtener sugerencias:", error);
                    }
                }, 250);
            });

            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.classList.add('hidden');
                }
            });
        }

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen", icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino", icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png" });
            }

            if (origenCoords && destCoords) {
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(origenCoords);
                bounds.extend(destCoords);
                map.fitBounds(bounds);
            } else {
                map.setCenter(coord);
                map.setZoom(15);
            }
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta por carretera con el router...";
                
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng)
                };

                router.route(request, (response, status) => {
                    if (status === 'OK') {
                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta por carretera trazada con éxito!";

                        const gmapsLink = document.getElementById('gmaps-link');
                        gmapsLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origenCoords.lat},${origenCoords.lng}&destination=${destCoords.lat},${destCoords.lng}&travelmode=driving`;
                        gmapsLink.classList.remove('hidden');
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta por carretera.";
                    }
                });
            } else {
                document.getElementById('status-msg').textContent = "Falta seleccionar origen o destino.";
            }
        }

        function copyCoords(type) {
            const lat = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lat`).textContent;
            const lon = document.getElementById(`${type === 'origin' ? 'origin' : 'dest'}-lon`).textContent;
            navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => {
                const btn = document.getElementById(`btn-copy-${type}`);
                const originalText = btn.textContent;
                btn.textContent = "¡Copiado!";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
