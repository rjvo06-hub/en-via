<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN-VIA - Panel de Rutas</title>
    <!-- Tailwind CSS para diseño limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Maps API con Places (New) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC52Px30bZ9ZqxrN8IO-VWZHLlFvios4_I&libraries=places,geometry" async defer></script>
    <style>
        #map { height: 450px; width: 100%; }
        gmp-place-autocomplete { width: 100%; }
        gmp-place-autocomplete input {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #1e293b;
            outline: none;
        }
        gmp-place-autocomplete input:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-blue-600">EN-VIA - Panel de Rutas</h1>
            <p class="text-slate-600 mt-1">Selecciona la dirección en el buscador oficial y haz clic en extraer.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Panel de Controles -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-6 lg:col-span-1">
                
                <!-- Origen -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Dirección de Origen</label>
                    
                    <!-- Componente oficial seguro contra errores de Google Maps -->
                    <gmp-place-autocomplete id="origen-autocomplete">
                        <input type="text" placeholder="Ej. Centro Comercial Sambil..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <button onclick="enviarAlExtractor('origen')" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2.5 px-3 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>🔍</span> Extraer Coordenadas de Origen
                    </button>
                    
                    <div class="p-3 bg-slate-100 rounded-lg border border-slate-200 text-xs text-slate-700 space-y-1">
                        <div><span class="font-bold">Seleccionado:</span> <span id="duplicado-origen" class="italic text-slate-500">Ninguno</span></div>
                        <div><span class="font-bold">Lat:</span> <span id="origin-lat">-</span> | <span class="font-bold">Lon:</span> <span id="origin-lon">-</span></div>
                    </div>
                </div>

                <!-- Destino -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Dirección de Destino</label>
                    
                    <!-- Componente oficial seguro contra errores de Google Maps -->
                    <gmp-place-autocomplete id="destino-autocomplete">
                        <input type="text" placeholder="Ej. Vereda del Lago..." autocomplete="off">
                    </gmp-place-autocomplete>
                    
                    <button onclick="enviarAlExtractor('destino')" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2.5 px-3 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                        <span>🔍</span> Extraer Coordenadas de Destino
                    </button>
                    
                    <div class="p-3 bg-slate-100 rounded-lg border border-slate-200 text-xs text-slate-700 space-y-1">
                        <div><span class="font-bold">Seleccionado:</span> <span id="duplicado-destino" class="italic text-slate-500">Ninguno</span></div>
                        <div><span class="font-bold">Lat:</span> <span id="dest-lat">-</span> | <span class="font-bold">Lon:</span> <span id="dest-lon">-</span></div>
                    </div>
                </div>

                <!-- Resumen de Ruta -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Distancia:</span>
                        <span id="route-distance" class="font-bold text-slate-800">-</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-600">Tiempo estimado:</span>
                        <span id="route-duration" class="font-bold text-slate-800">-</span>
                    </div>
                </div>

            </div>

            <!-- Panel del Mapa -->
            <div class="bg-white p-4 rounded-xl shadow-md lg:col-span-2 flex flex-col justify-between">
                <div class="rounded-lg overflow-hidden border border-slate-200 mb-4">
                    <div id="map"></div>
                </div>
                <div id="status-msg" class="text-slate-600 text-sm text-center italic">
                    Selecciona tu opción en el buscador y haz clic en extraer.
                </div>
            </div>
        </div>
    </div>

    <!-- Script de control con lectura profunda del componente web -->
    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let originMarker = null;
        let destMarker = null;
        let origenCoords = null;
        let destCoords = null;

        const maracaiboCenter = { lat: 10.6549, lng: -71.6146 };

        window.addEventListener('load', () => {
            // 1. Recibir datos cuando regresa del geo-extractor
            const datosRegresados = localStorage.getItem('en_via_resultado_coord');
            if (datosRegresados) {
                const res = JSON.parse(datosRegresados);
                if (res && res.tipo === 'origen') {
                    setAutocompleteValue('origen-autocomplete', res.direccion);
                    document.getElementById('duplicado-origen').textContent = res.direccion;
                    document.getElementById('duplicado-origen').className = "font-medium text-slate-900";
                    document.getElementById('origin-lat').textContent = res.lat;
                    document.getElementById('origin-lon').textContent = res.lng;
                    origenCoords = { lat: parseFloat(res.lat), lng: parseFloat(res.lng) };
                    updateMarker('origin', origenCoords);
                } else if (res && res.tipo === 'destino') {
                    setAutocompleteValue('destino-autocomplete', res.direccion);
                    document.getElementById('duplicado-destino').textContent = res.direccion;
                    document.getElementById('duplicado-destino').className = "font-medium text-slate-900";
                    document.getElementById('dest-lat').textContent = res.lat;
                    document.getElementById('dest-lon').textContent = res.lng;
                    destCoords = { lat: parseFloat(res.lat), lng: parseFloat(res.lng) };
                    updateMarker('dest', destCoords);
                }
                localStorage.removeItem('en_via_resultado_coord');
                verificarYCalcularRuta();
            }

            const checkMapsInterval = setInterval(() => {
                if (typeof google !== 'undefined' && google.maps) {
                    clearInterval(checkMapsInterval);

                    map = new google.maps.Map(document.getElementById('map'), {
                        center: maracaiboCenter,
                        zoom: 13,
                        mapTypeControl: false,
                        streetViewControl: false
                    });

                    directionsService = new google.maps.DirectionsService();
                    directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false });
                }
            }, 300);
        });

        // Función para rellenar el componente de Google al regresar
        function setAutocompleteValue(containerId, text) {
            const container = document.getElementById(containerId);
            if (container) {
                const input = container.querySelector('input');
                if (input) {
                    input.value = text;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }
        }

        // 2. Función infalible que extrae el texto del componente web moderno de Google
        function enviarAlExtractor(tipo) {
            const containerId = tipo === 'origen' ? 'origen-autocomplete' : 'destino-autocomplete';
            const duplicadoId = tipo === 'origen' ? 'duplicado-origen' : 'duplicado-destino';
            const container = document.getElementById(containerId);
            
            let direccion = "";
            if (container) {
                const input = container.querySelector('input');
                if (input) {
                    direccion = input.value.trim();
                }
            }

            if (!direccion) {
                alert("Por favor escribe o selecciona una dirección primero.");
                return;
            }

            // Mostrar duplicado visual abajo
            const dupEl = document.getElementById(duplicadoId);
            dupEl.textContent = direccion;
            dupEl.className = "font-medium text-slate-900";

            // Guardar objetivo y viajar al geo-extractor.html
            localStorage.setItem('en_via_objetivo', JSON.stringify({ direccion, tipo }));
            window.location.href = 'geo-extractor.html';
        }

        function updateMarker(type, coord) {
            if (type === 'origin') {
                if (originMarker) originMarker.setMap(null);
                originMarker = new google.maps.Marker({ map: map, position: coord, title: "Origen" });
            } else {
                if (destMarker) destMarker.setMap(null);
                destMarker = new google.maps.Marker({ map: map, position: coord, title: "Destino" });
            }
            map.setCenter(coord);
            map.setZoom(15);
        }

        function verificarYCalcularRuta() {
            if (origenCoords && destCoords) {
                document.getElementById('status-msg').textContent = "Calculando ruta vial con Google...";
                const request = {
                    origin: new google.maps.LatLng(origenCoords.lat, origenCoords.lng),
                    destination: new google.maps.LatLng(destCoords.lat, destCoords.lng),
                    travelMode: google.maps.TravelMode.DRIVING
                };

                directionsService.route(request, (response, status) => {
                    if (status === 'OK') {
                        if (originMarker) originMarker.setMap(null);
                        if (destMarker) destMarker.setMap(null);
                        directionsRenderer.setDirections(response);

                        const route = response.routes[0].legs[0];
                        document.getElementById('route-distance').textContent = route.distance.text;
                        document.getElementById('route-duration').textContent = route.duration.text;
                        document.getElementById('status-msg').textContent = "¡Ruta trazada correctamente!";
                    } else {
                        document.getElementById('status-msg').textContent = "No se pudo calcular la ruta.";
                    }
                });
            }
        }
    </script>
</body>
</html>
